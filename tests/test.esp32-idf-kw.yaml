# KW (VS1) protocol on esp-idf. Compile gate for the KW exchange
# (optolink_kw.h) through the real ESPHome+PlatformIO build.
# Force identify_device off to exercise the disabled path in CI. NOTE: the
# DEFAULT for KW is now ON (identification is hardware-confirmed on KW); this
# "false" is a test override, not the default.
substitutions:
  recorder_persist: "false"
  name: vitohome-test-idf-kw
  protocol: KW
  log_frames: "true"
  identify_device: "false"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

<<: !include common.yaml

# `access: gfa` entities (KW and P300; GWG has no GFA read).
packages:
  gfa: !include common-gfa.yaml
