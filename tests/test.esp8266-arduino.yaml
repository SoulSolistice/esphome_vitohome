# ESP8266 compile gate (Arduino, the only ESP8266 framework).
#
# PINS
# ----
# common.yaml's pins are ESP32 pins (GPIO16/17/21/22), several of which do not
# exist on an ESP8266. The i2c: key below overrides the one of the common.yaml
# package, and the uart: entry replaces the package's through `!remove` (a
# list entry with the same id would be a duplicate). common.yaml stays the
# single source of entity coverage while this file only swaps the wiring.

substitutions:
  name: vitohome-test-esp8266
  protocol: P300
  log_frames: "false"
  identify_device: "true"

esp8266:
  board: d1_mini

i2c:
  sda: GPIO4
  scl: GPIO5

uart:
  - id: !remove uart_optolink
  - id: uart_optolink
    rx_pin: GPIO13
    tx_pin: GPIO15
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

# The second raw gate compiles queue_raw_frame()'s sending branch with the
# P300 engine; the esp32 P300 configs keep the refusal.
packages:
  common: !include common.yaml
  unsafe_raw:
    vitohome:
      unsafe_raw_writes: true
