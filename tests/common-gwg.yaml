# GWG-only test config.
#
# GWG cannot share common.yaml: the GWG protocol addresses a SINGLE BYTE.
# PacketGWG::createPacket() serialises `addr & 0xFF`, so every 16-bit address in
# common.yaml (0x0800, 0x2500, ...) would be silently truncated to its low byte
# and read the wrong datapoint. vcontrold agrees: its GWG device (ID 2053,
# "GWG_VBEM", protocol="GWG") overrides all 26 of its addresses onto one byte.
# The hub's FINAL_VALIDATE_SCHEMA now rejects the combination outright, which is
# how this file came to exist -- common.yaml had been addressing garbage under
# `protocol: GWG` since the wrapper was written.
#
# The addresses below are taken from vcontrold's GWG device overrides. This is
# a CODEGEN gate (OptolinkEngine<GWG> + the GWG branch of ProtocolAdapter), not
# a wire test: GWG remains unverified on hardware.

esphome:
  name: ${name}

external_components:
  - source:
      type: local
      path: ../components
    components: [vitohome]

logger:
  level: DEBUG

uart:
  - id: uart_optolink
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

vitohome:
  id: vito
  uart_id: uart_optolink
  protocol: ${protocol}
  update_interval: 60s
  identify_device: ${identify_device}
  log_frames: ${log_frames}

sensor:
  # NOTE: several read entities below deliberately omit `access:` to keep the
  # implicit-physical read path in the codegen gate. Under GWG that now emits
  # a "does not set 'access'; assuming physical" WARNING per entity -- expected
  # here, not a regression. Reads only warn (a blank Vitosoft FCRead genuinely
  # means physical); writes are a hard error, which is why every writable
  # entity in this file states its mode.
  # vcontrold GWG (device 2053): getTempA -> addr 05, len 1, unit UTI
  - platform: vitohome
    name: "GWG Temp Aussen"
    address: 0x05
    length: 1
    converter: noconv
    signed: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  # access: -- the GWG access mode selects the telegram TYPE byte, and GWG's
  # address space is PER MODE, so this is part of the datapoint's identity, not
  # a tweak. Vitosoft has 0x17 as BEMK50Brennerlaufzeit on EEPROM_READ (0xAE);
  # vcontrold agrees (getBrennerStunden1 / geteaddr). Reading it on the default
  # physical mode is what produced the non-monotonic counter in design_notes.
  - platform: vitohome
    name: "GWG Brennerlaufzeit"
    address: 0x17
    access: eeprom
    length: 1
    converter: noconv
    unit_of_measurement: "h"
    state_class: total_increasing
  # getTempKist -> addr 00, len 1
  - platform: vitohome
    name: "GWG Temp Kessel"
    address: 0x00
    length: 1
    converter: noconv
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 120s

binary_sensor:
  - platform: vitohome
    type: connectivity
    name: "GWG Optolink Link"
  # getBrennerStatus (device 2053) -> addr 22, len 1, bit 1, unit BST.
  # NOTE vcontrold's <bit> is LSB-first by construction: its BST unit computes
  # `(B0 & (0x01 << BP)) >> BP`. Vitosoft's BitPosition is MSB-first. Do not
  # copy a number from one into the other -- here bit 1 LSB-first is mask 0x02.
  - platform: vitohome
    name: "GWG Brenner"
    address: 0x22
    length: 1
    bit_mask: 0x02
    device_class: running
  # Vitosoft has the GWG outputs at 0x01 on Port_READ (0x6E) -- the same address
  # is a different datapoint under eeprom and kmbus_eeprom, which is exactly why
  # access: has to travel with it.
  - platform: vitohome
    name: "GWG Ausgang Heizkreispumpe"
    address: 0x01
    access: port
    length: 1
    bit_mask: 0x01
    device_class: running

text_sensor:
  - platform: vitohome
    type: enum
    name: "GWG Betriebsart"
    access: virtual
    address: 0x3F
    length: 1
    options:
      0x00: "Abschaltbetrieb"
      0x01: "Nur Warmwasser"
      0x02: "Heizen und Warmwasser"

number:
  # A WRITABLE entity carrying access: -- one mode drives both directions, so
  # this reads with EEPROM_READ (0xAE) and writes with EEPROM_WRITE (0xAD).
  # Vitosoft marks every writable GWG datapoint as EEPROM or BE and NONE as
  # physical, so this is the shape a real GWG write takes. Codegen gate only:
  # GWG writes are unverified on hardware (THIRD_PARTY.md #19).
  - platform: vitohome
    name: "GWG Kesselmaximaltemperatur"
    address: 0x01
    access: eeprom
    length: 1
    converter: noconv
    min_value: 10
    max_value: 90
    step: 1
    update_interval: 3600s
  # The other writable GWG mode. EEPROM_WRITE (1082 datapoints) and BE_WRITE
  # (280) are the only two Vitosoft uses, so between them these two entities
  # cover every writable shape that actually occurs. This one carried no
  # access: until the writable-entity requirement landed -- it was relying on
  # the implicit physical default, i.e. exactly the silent-wrong-datapoint case
  # that requirement exists to stop (PHYSICAL_WRITE is used by zero Vitosoft
  # GWG datapoints). Codegen gate only: GWG writes are unverified on hardware
  # (THIRD_PARTY.md #19).
  - platform: vitohome
    name: "GWG WW Solltemperatur"
    address: 0x63
    access: be
    length: 1
    converter: noconv
    min_value: 10
    max_value: 60
    step: 1
    update_interval: 3600s
