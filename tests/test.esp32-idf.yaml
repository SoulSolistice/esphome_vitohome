substitutions:
  name: vitohome-test-idf
  protocol: P300
  log_frames: "false"
  identify_device: "true"

esp32:
  board: esp32dev
  # The PlatformIO toolchain, pinned: the ESP32 default is the native
  # `esp-idf` one, which tests/test.esp32-idf-native.yaml builds, so both stay
  # covered (design_notes.md, section 11, "Build").
  toolchain: platformio
  framework:
    type: esp-idf

<<: !include common.yaml

# The P300-only `access: rpc` entities (common.yaml is shared with KW), and the
# `access: gfa` ones (KW and P300).
packages:
  rpc: !include common-rpc.yaml
  gfa: !include common-gfa.yaml
