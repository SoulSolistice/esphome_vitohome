substitutions:
  recorder_persist: "true"
  name: vitohome-test-idf-native
  protocol: P300
  log_frames: "false"
  identify_device: "true"

esp32:
  board: esp32dev
  # The native ESP-IDF toolchain (esp32.toolchain: esp-idf), the ESP32
  # default, which drives idf.py/CMake directly; not the same setting as
  # esp32.framework.type. Compiled on every push by the `compile-idf-native`
  # job in ci.yml, a job of its own because it caches its SDK under
  # ~/.cache/esphome/idf (design_notes.md, section 11, "Build").
  toolchain: esp-idf
  framework:
    type: esp-idf

<<: !include common.yaml
