# Hardware findings: what real units showed where the Vitosoft export is
# incomplete or wrong. The generator applies each one to the device tokens it
# names, and only to those (format: confirmed.py). Add a token to `devices`
# after a unit of that type confirmed the finding too, or say above the entry
# why the finding holds for it without one.

# Confirmed on one BES unit. Every GWG device with this row shares it, and
# little-endian the same bytes read 150-165 bar.
[[finding]]
tech = "GWG_Wasserdruck"
action = "change"
devices = [
  "GWG_VBEM_00", "GWG_VBEM_03", "GWG_VBEM_21", "GWG_VBEM_35", "GWG_VBEM_36",
  "GWG_VBES_00", "GWG_VBES_03", "GWG_VBES_21", "GWG_VBES_35", "GWG_VBES_36",
  "GWG_VBT2_00", "GWG_VBT2_03", "GWG_VBT2_21", "GWG_VBT2_35", "GWG_VBT2_36",
  "GWG_VWMS_00", "GWG_VWMS_03", "GWG_VWMS_21", "GWG_VWMS_35", "GWG_VWMS_36",
]
checked = "read"
what = "big-endian: raw 01 71..01 7C is 1.27-1.33 bar, rising with the boiler temperature"
unit = "0x2053 HW=0x01 SW=0x1E (BES)"
source = "SoulSolistice/esphome_vitohome#35"
set = { big_endian = true }

# ---- GWG_VBES: Vitodens with the BES operating unit, one unit ---------------
# The five VBES tokens are software revisions of the boiler control; the
# operating unit, a BES, is the same on all of them.

# The BEM's settings on `be`, and the clock there: on the BES every `be`
# address 0x00-0xFF answered 0xFF.
[[finding]]
tech = [
  "GWG_BetriebsprogrammBEM", "GWG_DifferenztemperaturBEM",
  "GWG_Neigung_HKA_BEM", "GWG_Neigung_HKB_BEM", "GWG_Niveau_HKA_BEM", "GWG_Niveau_HKB_BEM",
  "GWG_Raumtemperatur_SollwertNormalBEM", "GWG_Raumtemperatur_SollwertPartyBEM",
  "GWG_Raumtemperatur_SollwertredBEM", "GWG_Trinkwasser_SolltemperaturBEM",
  "GWG_Uhrzeit_Minute", "GWG_Uhrzeit_Stunde", "GWG_Uhrzeit_Wochentag",
  "GWG_Vorlaufmaximaltemperatur_HKA_BEM", "GWG_Vorlaufmaximaltemperatur_HKB_BEM",
]
action = "drop"
devices = ["GWG_VBES_00", "GWG_VBES_03", "GWG_VBES_21", "GWG_VBES_35", "GWG_VBES_36"]
checked = "read"
what = "every be address 0x00-0xFF answered 0xFF"
unit = "0x2053 HW=0x01 SW=0x1E (BES)"
source = "SoulSolistice/esphome_vitohome#35"

[[finding]]
tech = "GWG_Raumtemperatur_SollwertParty"
action = "drop"
devices = ["GWG_VBES_00", "GWG_VBES_03", "GWG_VBES_21", "GWG_VBES_35", "GWG_VBES_36"]
checked = "read"
what = "the BES has no party mode"
unit = "0x2053 HW=0x01 SW=0x1E (BES)"
source = "SoulSolistice/esphome_vitohome#35"

# The VBEM rows carry (46) at EEPROM 0x0D on every revision; the VBES rows
# leave it out, and nothing else uses that address there.
[[finding]]
tech = "GWG_BEMK46DrehzahlreduziertHKP"
action = "add"
devices = ["GWG_VBES_00", "GWG_VBES_03", "GWG_VBES_21", "GWG_VBES_35", "GWG_VBES_36"]
checked = "read"
what = "(46) at EEPROM 0x0D: 0x2D (45 %), the same as PHYSICAL 0xA1"
unit = "0x2053 HW=0x01 SW=0x1E (BES)"
source = "SoulSolistice/esphome_vitohome#35"
group_of = "GWG_K44MindestdrehzahlHKP"

