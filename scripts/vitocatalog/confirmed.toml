# The refrigerant block 0x0E.. is on no device in the export. Each is 3 bytes:
# a signed int16 / 10 and a status byte. The export gives the device similar
# quantities at 0xB406..0xB40B (WPR3_VERDAMPFUNG, _KONDENSATION, _SAUGGAS,
# _HEISSGAS, _UEBERHITZUNG_SOLL); whether those answer on this unit is open.

[[finding]]
tech = "VH_WPR_0E03_Sauggastemperatur_Verdichter"
action = "define"
devices = ["CU401B_S"]
checked = "read"
what = "suction temperature at the compressor"
unit = "0x204D HW=0x01 SW=0x41 (Vitocal 222-S)"
source = "SoulSolistice/esphome_vitohome#19"
name = { de = "Sauggastemperatur am Verdichter", en = "Suction temperature at the compressor" }
set = { address = 0x0E03, conversion = "Div10", access_type = 1, block_length = 3, byte_length = 2, byte_position = 0, fc_read = "Virtual_READ", unit = "°C" }
group_of = "WPR3_B410_Sauggasdruck"

