# =============================================================================
# vitohome — RAW SCAN CONSOLE  (uses the hub raw-lane addition)
# =============================================================================
# This config drives the hub feature: queue_raw_read / queue_raw_write /
# queue_raw_rpc / queue_raw_gfa_read and a hub-fed `text_sensor: type:
# scan_result`:
#   * READ-NOW  — an immediate one-off read, not "next poll tick".
#   * GFA READ   — the same read in the burner control's address space (the
#                  KW telegram 0x6B; a P300 hub drops to KW for it), e.g.
#                  4050 = P80, its chip.
#   * RAW HEX    — the response as bytes + exact 64-bit integer views (no
#                  float32 narrowing on 4-byte values).
#   * RAW WRITE  — an arbitrary byte payload (not just one LE integer).
#   * RAW RPC    — a remote procedure call (P300 function code 0x07) with a
#                  parameter, e.g. one record of a heat pump's fault buffer
#                  (0xA801, parameter = record index). Disabled by default:
#                  a procedure that is not a reading RUNS at once.
#   * RANGE SWEEP— scan a contiguous block from a Home Assistant action.
#   * RAW OP     — any telegram of any layer, typed as one line (needs
#                  `raw_access: unrestricted`, set below):
#                    p300 r 05 1000 16     P300 function code 05, 16 bytes
#                    kw r 7B 0800 2        a KW telegram (P300: the KW detour)
#                    gwg r 31 05 1         a GWG TYPE byte
#                    p300 w 02 2306 25     a telegram with payload
#                  The P300 code is the low five bits of the flags byte
#                  (1..1F); an error frame shows its code (01: address not
#                  served, 05: function code not implemented). Telegrams that
#                  may change the controller -- physical / EEPROM writes, KW
#                  GFA_WRITE / PROZESS_WRITE, payloads with unnamed codes --
#                  also need `unsafe_raw_writes: true`, deliberately not set.
#
# GWG units: set `protocol: GWG` and pass the access mode as the last argument,
# e.g. queue_raw_read(0x05, 1, optolink::GWGAccessMode::EEPROM) or
# queue_raw_write(0x05, bytes, optolink::GWGAccessMode::EEPROM). Modes:
# PHYSICAL (default), VIRTUAL, EEPROM, XRAM, PORT, BE, KMBUS_RAM, KMBUS_EEPROM --
# the catalog's `access:` value for that datapoint. RPC and GFA reads do not
# exist there.
#
# =============================================================================

# --- The result surface: a hub-fed text sensor (no address, no polling) ------
text_sensor:
  - platform: vitohome
    vitohome_id: vito
    type: scan_result
    id: scan_raw
    name: "Scan ▸ Raw result"
    entity_category: diagnostic

# --- Inputs -----------------------------------------------------------------
text:
  - platform: template
    id: scan_addr
    name: "Scan · Address (hex, e.g. 0800)"
    optimistic: true
    mode: text
    initial_value: "0800"
    entity_category: config

  - platform: template
    id: scan_write_bytes
    name: "Scan · Write bytes (hex, e.g. 01 or 00 0A)"
    optimistic: true
    mode: text
    initial_value: ""
    entity_category: config

  # The parameter of a remote procedure call: the catalog's `prefix:` for an
  # `access: rpc` entity (e.g. 00 for the newest record at 0xA801). May be empty.
  # One raw operation as a line (RAW OP in the header).
  - platform: template
    id: scan_op
    name: "Scan · Raw op (e.g. p300 r 05 1000 16)"
    optimistic: true
    mode: text
    max_length: 120
    initial_value: "p300 r 01 00F8 8"
    entity_category: config

  - platform: template
    id: scan_rpc_parameter
    name: "Scan · RPC parameter (hex, may be empty)"
    optimistic: true
    mode: text
    initial_value: "00"
    entity_category: config

number:
  # 1..48 is the hub's own cap (RAW_READ_MAX). (The old max of 9 mirrored
  # vcontrold's XML limit, which is a vcontrold limitation, not a protocol one.)
  # 48 covers every block the catalogs emit, including the 42-byte Beschriftung_*
  # label blocks. Raw WRITES are still capped at 32 (inline payload storage).
  - platform: template
    id: scan_length
    name: "Scan · Read length (bytes)"
    optimistic: true
    min_value: 1
    max_value: 48
    step: 1
    initial_value: 2
    mode: box
    entity_category: config

# --- Actions ----------------------------------------------------------------
button:
  # Immediate one-off read; result lands on "Scan ▸ Raw result".
  - platform: template
    name: "Scan ▸ Raw read (now)"
    entity_category: config
    on_press:
      - lambda: |-
          long a = strtol(id(scan_addr).state.c_str(), nullptr, 16);
          if (a < 0 || a > 0xFFFF) { ESP_LOGW("scan", "address out of range: %s", id(scan_addr).state.c_str()); return; }
          id(vito).queue_raw_read((uint16_t) a, (uint8_t) id(scan_length).state);

  # The same read in the burner control's address space (0x6B, the catalog's
  # `access: gfa`), e.g. 4050 = P80, the burner-control chip. Read-only.
  - platform: template
    name: "Scan ▸ Raw GFA read (now)"
    entity_category: config
    on_press:
      - lambda: |-
          long a = strtol(id(scan_addr).state.c_str(), nullptr, 16);
          if (a < 0 || a > 0xFFFF) { ESP_LOGW("scan", "address out of range: %s", id(scan_addr).state.c_str()); return; }
          id(vito).queue_raw_gfa_read((uint16_t) a, (uint8_t) id(scan_length).state);

  # Arbitrary-byte write: parse the hex string (spaces/colons ignored) into bytes.
  - platform: template
    name: "Scan ▸ Raw write"
    entity_category: config
    on_press:
      - lambda: |-
          long a = strtol(id(scan_addr).state.c_str(), nullptr, 16);
          if (a < 0 || a > 0xFFFF) { ESP_LOGW("scan", "address out of range: %s", id(scan_addr).state.c_str()); return; }
          auto ishex = [](char c) {
            return (c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F');
          };
          std::string hex;
          for (char ch : id(scan_write_bytes).state) { if (ishex(ch)) hex.push_back(ch); }
          if (hex.empty() || (hex.size() % 2) != 0) {
            ESP_LOGW("scan", "write bytes: need an even number of hex digits, got '%s'", id(scan_write_bytes).state.c_str());
            return;
          }
          std::vector<uint8_t> bytes;
          for (size_t i = 0; i + 1 < hex.size(); i += 2) {
            bytes.push_back((uint8_t) strtol(hex.substr(i, 2).c_str(), nullptr, 16));
          }
          ESP_LOGW("scan", "RAW WRITE 0x%04X (%u bytes)", (unsigned)(uint16_t)a, (unsigned)bytes.size());
          id(vito).queue_raw_write((uint16_t) a, bytes);

  # Remote procedure call (P300): address + parameter; the answer lands on
  # "Scan ▸ Raw result" like a read. Only call addresses the catalog emits as
  # readings (`access: rpc`): a procedure with an effect -- clearing a history,
  # a reset -- RUNS on the controller at once. Disabled by default for that.
  - platform: template
    name: "Scan ▸ Raw RPC (P300)"
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          long a = strtol(id(scan_addr).state.c_str(), nullptr, 16);
          if (a < 0 || a > 0xFFFF) { ESP_LOGW("scan", "address out of range: %s", id(scan_addr).state.c_str()); return; }
          auto ishex = [](char c) {
            return (c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F');
          };
          std::string hex;
          for (char ch : id(scan_rpc_parameter).state) { if (ishex(ch)) hex.push_back(ch); }
          if ((hex.size() % 2) != 0) {
            ESP_LOGW("scan", "RPC parameter: need an even number of hex digits, got '%s'", id(scan_rpc_parameter).state.c_str());
            return;
          }
          std::vector<uint8_t> parameter;
          for (size_t i = 0; i + 1 < hex.size(); i += 2) {
            parameter.push_back((uint8_t) strtol(hex.substr(i, 2).c_str(), nullptr, 16));
          }
          ESP_LOGW("scan", "RAW RPC 0x%04X (%u parameter bytes)", (unsigned)(uint16_t)a, (unsigned)parameter.size());
          id(vito).queue_raw_rpc((uint16_t) a, parameter);

  # The line in "Scan · Raw op": one telegram, any layer and code. The answer,
  # its time and a P300 error code land on "Scan ▸ Raw result".
  - platform: template
    name: "Scan ▸ Raw op"
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGW("scan", "RAW OP '%s'", id(scan_op).state.c_str());
          id(vito).queue_raw_op(id(scan_op).state);
