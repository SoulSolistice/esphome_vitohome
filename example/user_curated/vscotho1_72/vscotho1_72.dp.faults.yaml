# ============================================================
# vitohome - VScotHO1_72 fault histories (companion of vscotho1_72.dp.curated.yaml)
#
# Both fault archives of the unit, with the fault texts that are SPECIFIC to
# it. Neither text set is hand-typed; each is linked from where Viessmann's data
# put it:
#
#   SYSTEM history (Vitotronic): ecnsysEventType~Error, BlockLength 90 /
#   BlockFactor 10 -> ten 9-byte slots at 0x7507 + n*9, newest first
#   (hardware-confirmed, docs/design_notes.md section 7). Texts: Vitosoft's own
#   set for this device, viessmann.errorcode.VScotHO1_72.* (110 codes), copied
#   verbatim from the generated catalog example/catalogs/de/vscotho1_72.yaml
#   (entity `letzter_fehler`). Written ONCE below as &vscotho1_72_fault_codes and
#   linked (*vscotho1_72_fault_codes) into all ten slots and the fault event.
#
#   GFA history (Feuerungsautomat / burner control): FehlerHisFA01..20, 9-byte
#   slots at 0x7590 + n*9. Its code space belongs to the burner-control CHIP,
#   not to the device type, so this file carries NO texts for it. The ids
#   gfa_fehler_01..20 are the ones the generated chip companion extends:
#   vscotho1_72.vitohome.yaml links example/catalogs/de/gfa/chip_24.yaml
#   (Vitosoft viessmann.errorcode.fa.24.*), the chip the reference unit reports
#   at boot ("GFA=0x24 (NEC)", read from 0x7650 GFA_Kennung). On a unit that
#   logs a different GFA=0x.., link gfa/chip_<XX>.yaml instead. Linking a chip
#   companion REQUIRES all twenty ids below: `!extend` fails on a missing id.
#
# Replaces the hand-curated `vd300` map (B3HA Serviceanleitung, 94 codes) the
# curated package used before. Vitosoft's set contains every one of those 94
# codes plus 16 more, and gives several a DIFFERENT meaning, e.g.
#   0x1D  vd300: "Keine Kommunikation mit Sensor"
#         Vitosoft: "Störung Volumenstromsensor (STRS1)"
#   0x49  vd300: "Codierung Erweiterung Mischer Heizkreis 2 falsch eingestellt"
#         Vitosoft: "Rücklauftemperatur HK2 Unterbrechung"
# (also 0x4D, 0x93, 0x9B). The vd300 map stays available in
# scripts/fault_codes.py (VITOTRONIC_VD300_B3HA) if you prefer the manual's
# wording.
#
# Bus cost: slot 1 of each archive polls every 300 s; the older slots only
# change when a new fault pushes the archive down, so they poll hourly and are
# hidden in Home Assistant by default (`disabled_by_default` is a UI hint only --
# they are still read). The GFA slot reads are model-derived: the layout comes
# from the export, and no GFA slot has been confirmed on hardware yet
# (design_notes section 7). If the device NAKs a 9-byte slot read, drop
# `length:` to 1 for a code-only entity.
# ============================================================

