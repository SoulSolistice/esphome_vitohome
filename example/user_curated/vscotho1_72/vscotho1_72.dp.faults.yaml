# Fires a Home Assistant logbook event when the newest SYSTEM fault code
# CHANGES: hex type ("0x38") for a mapped code, "cleared" on a transition to
# 0x00, "unknown" otherwise. The first poll only records a baseline (no
# stale-fault spam at boot); read errors keep the baseline. Same slot and same
# linked texts as "Letzter Fehler" above (0x00 is dropped from the event types
# by the component, see components/vitohome/event.py).
event:
  - platform: vitohome
    name: "Heizung Störung"
    id: fault_event
    address: 0x7507   # SYSTEM history slot 1 -- same slot as "Letzter Fehler"
    length: 9
    update_interval: 300s
    codes: *vscotho1_72_fault_codes
