  - platform: vitohome
    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Diagnosis / Erweiterung EA2 ---
  # vito: overview trend
  - platform: vitohome
    type: enum
    name: "Digitaler Eingang"
    id: SR13_DI1
    address: 0x0888
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Aus"
      0x01: "Ein"

  # --- EA2 / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Letzter Fehler"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.EA2.*)
    codes: &letzter_fehler_codes
      0x00: "Kein Fehler"
      0x30: "Unterbrechung Sensor 1"
      0x31: "Unterbrechung Sensor 2"
      0x38: "Kurzschluss Sensor 1"
      0x39: "Kurzschluss Sensor 2"
      0xAE: "Fehler Codierschalter EA2"
      0xB2: "Interner Fehler EA2"
      0xB3: "Kommunikationsstörung EA2"
      0xD1: "Digitaler Eingang EA2"

  # System fault history slot 2 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 1*9; vcontrold getError1).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
