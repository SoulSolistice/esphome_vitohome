      0x11: "Sekundärluftklappe öffnen"
      0x12: "Sekundärluftklappe schliessen"
      0x1C: "Zusätzlicher Kessel"

  # --- Kessel ---
  # vito: circuit=boiler quickcheck
  - platform: vitohome
    name: "Zusätzlicher Kessel BA"
    id: Ecotronic_Zus_tzlicher_Kessel_BA
    address: 0x57A0
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Aus"
      0x01: "1: Automatik"
      0x02: "2: Ein"

  # --- (ohne Gruppenzuordnung) ---
  # vito: quickcheck
  - platform: vitohome
    name: "Zirkulation Betriebsprogramm"
    id: Ecotronic_Zirkulation_BA
    address: 0x2140
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Aus"
      0x01: "1: Automatik"

  # vito: quickcheck
  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "BedienBetriebsartTyp"
    id: BedienBetriebsart
    address: 0x2301
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 Sommerbetrieb"
      0x01: "1 DAUERND_REDUZIERT"
      0x02: "2 DAUERND_NORMAL"
      0x03: "3 NORMAL_REDUZIERT"
      0x04: "4 NORMAL_ABSCHALT"
      0x05: "5 DAUERND_ABSCHALT"

