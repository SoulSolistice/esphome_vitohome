# ============================================================
# vitohome package generated for device: Vitocom100_LAN
# product (Vitosoft): Vitocom 100 LAN1 [VC 100 LAN1]
# profile: standard   entities: 4
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON: 3 datapoint(s) whose access method this
# engine has no read for (PROZESS/KBUS/OT, and remote procedures
# that are neither a reading nor an action) were omitted as unreachable.
# Re-run with --no-reachable-only to include them.
#
# Metadata: 3 entities carry a `# vito:` line with Vitosoft's own
# grouping, for the catalog editor: circuit=hk1..hk6|dhw|solar|boiler|
# cascade|mbus (the menu they are in), level=td (shown at the service
# access level only), overview, quickcheck and trend (Vitosoft's overview
# screen, quick check and trend recorder), and gfa=<chips> (the burner-
# control chips a GFA datapoint is listed for). ESPHome ignores them.
#
# WRITABLE WITHOUT A RANGE: 2 datapoint(s) are writable in Vitosoft, but
# the export gives no usable borders for them. Each is emitted READ-ONLY
# under a CAUTION comment. Making one a `number` means choosing its
# range yourself, and nothing here checks it: confirm the range on the
# unit (or its service manual) first, and take extra care writing it.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value.
# ============================================================

sensor:
  # --- Versionen ---
  # vito: overview
  # CAUTION: Vitosoft marks this datapoint WRITABLE, but the export gives no
  # usable range for it (borders absent or equal, a zero step, or outside
  # the byte width). It is emitted READ-ONLY. To write it, declare it as a
  # `number` with a min_value / max_value / step you have confirmed on the
  # unit: nothing in this catalog bounds what you would send.
  - platform: vitohome
    name: "Anlagennummer"
    id: vcLanAnlagennummer
    address: 0x7776
    length: 1
    converter: noconv
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

  # vito: overview
  # CAUTION: Vitosoft marks this datapoint WRITABLE, but the export gives no
  # usable range for it (borders absent or equal, a zero step, or outside
  # the byte width). It is emitted READ-ONLY. To write it, declare it as a
  # `number` with a min_value / max_value / step you have confirmed on the
  # unit: nothing in this catalog bounds what you would send.
  - platform: vitohome
    name: "Teilnehmernummer"
    id: vcLanTeilnehmernummer
    address: 0x7777
    length: 1
    converter: noconv
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Versionen ---
  # vito: overview
  - platform: vitohome
    type: enum
    name: "Vitocom Typ"
    id: vcLanModemTyp
    address: 0xAE00
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Kein"
      0x01: "ISDN"
      0x02: "Analog"
      0x03: "GSM"
      0x04: "GPRS"
