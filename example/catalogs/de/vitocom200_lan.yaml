# --- datapoints needing custom decode (not auto-emitted) ---
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Softwareversion @ 0xAC00: NoConversion length 8 > 4 bytes -> custom decode
# Hostname @ 0xAC10: FixedStringTerminalZeroes length 65 > 4 bytes -> custom decode
# Statische IP-Adresse @ 0xAC7A: FixedStringTerminalZeroes length 16 > 4 bytes -> custom decode
