      0x42: "Erweiterungseinheit 2 Kommunikation unterbrochen"
      0x50: "Fehler Kommunikation H8 - Neuron"
      0x51: "Testmeldung VC300 an Vitodata"
      0xA0: "Trendingdatei (*.BAK) wurde erzeugt"
      0xD0: "Kein Lebenszeichen der Anlage erhalten"
