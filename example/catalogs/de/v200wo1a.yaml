# --- datapoints needing custom decode (not auto-emitted) ---
# Raumtemperatur Kühlkreis @ 0x01DA: BitPosition 4 implies byte 0 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
# Meldung anstehend @ 0x1410: 4-bit field at BitPosition 61 does not fit in one byte -> custom decode
# WPR_vmarSchaltzeitenGroup_1_0 @ 0x9000: NoConversion length 24 > 4 bytes -> custom decode
# Schaltzeiten HK1 @ 0x9000: NoConversion length 168 > 4 bytes -> custom decode
# Schaltzeiten HK2 @ 0x9007: NoConversion length 168 > 4 bytes -> custom decode
# Schaltzeiten HK3 @ 0x900E: NoConversion length 168 > 4 bytes -> custom decode
# Schaltzeiten Pufferspeicher @ 0x9015: NoConversion length 168 > 4 bytes -> custom decode
# Schaltzeiten WW @ 0x901C: NoConversion length 168 > 4 bytes -> custom decode
# Schaltzeiten HK1 @ 0x9200: NoConversion length 168 > 4 bytes -> custom decode
