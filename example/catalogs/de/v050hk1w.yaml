    address: 0x2301
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Nur WW"
      0x01: "Dauernd Reduziert"
      0x02: "Dauernd Normal"
      0x03: "Heizen + WW"
      0x04: "Heizen + WW (0x04)"
      0x05: "Abschalt"

