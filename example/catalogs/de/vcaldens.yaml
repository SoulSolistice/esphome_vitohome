# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

sensor:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Kesseltemperatur"
    id: TiefpassTemperaturwert_KTS
    address: 0x0810
    length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Int, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Betriebsstunden Brenner Stufe 1"
    id: BetriebsstundenBrenner1
    address: 0x0886
    length: 4
    converter: sec2hour
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    disabled_by_default: true
    update_interval: 600s

binary_sensor:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Brenner"
    id: GWG_Flamme
    address: 0x55D3
    length: 9
    byte_offset: 5
    bit_mask: 0x20
    disabled_by_default: true
    update_interval: 60s

number:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Brennerstarts"
    id: BrennerstartsGWG
    address: 0x088A
    length: 4
    converter: noconv
    min_value: 0
    max_value: 1193045
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
