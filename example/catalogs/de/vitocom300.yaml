    update_interval: 60s
    options:
      0x00: "Selfbinding"
      0x01: "Toolbinding"
      0xFF: "default"

  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Letzter Fehler"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.Vitocom300.*)
    codes: &letzter_fehler_codes
      0x00: "Anlage ohne Fehler"
      0x02: "Spannungsausfall"
      0x03: "Spannungswiederkehr"
      0x04: "Fehler Flashdisk"
      0x05: "INC-Datei für Kor.AD-Werte nicht vorhanden"
      0x10: "Wartungstaster aktiviert"
      0x11: "Wartungstaster deaktiviert"
      0x12: "Wartungstaster Timeout abgelaufen"
      0x20: "Lebenszeichen"
      0x30: "Fehler Kommunikation AVR - H8"
      0x40: "Erweiterungseinheit 1 Kommunikation unterbrochen"
      0x42: "Erweiterungseinheit 2 Kommunikation unterbrochen"
      0x50: "Fehler Kommunikation H8 - Neuron"
      0x51: "Testmeldung VC300 an Vitodata"
      0xA0: "Trendingdatei (*.BAK) wurde erzeugt"
      0xD0: "Kein Lebenszeichen der Anlage erhalten"
      0xE0: "Teilnehmer ausgefallen"
      0xE1: "Teilnehmer ausgefallen"
      0xFF: "Eingang meldet Störung"

  # System fault history slot 2 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 1*9; vcontrold getError1).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
