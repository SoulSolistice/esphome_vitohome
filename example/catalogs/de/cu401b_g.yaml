text_sensor:
  - platform: vitohome
    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- CU401B G ---
  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Mischer ext. Wärmerzeuger Status"
    id: WPR_Mischer_ext_Waermerzeuger_Status
    entity_category: diagnostic
    address: 0x0603
    length: 8
    byte_offset: 4
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "VORHANDEN"
      0x01: "NICHT VORHANDEN"

  # Fault history record 1 of 30 (ecnsysEventType~WPR3Error, a 30 x 9-byte
  # remote procedure array at 0xA801: one call per record, the
  # record index 0 as the parameter). Raw hex: the record layout is not
  # decoded yet. Index 0 is taken as the newest; unconfirmed on hardware.
  - platform: vitohome
    type: raw
    name: "Letzter Fehler (WPR3)"
    id: letzter_fehler_wpr3
    address: 0xA801
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # the record index
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s

  # Fault history record 2 of 30 (ecnsysEventType~WPR3Error, a 30 x 9-byte
