# WW Temperatur Mitte ab Bit 4 @ 0x01CF: BitPosition 4 implies byte 0 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
# WW Temperatur Mitte ab Bit 0 @ 0x01CF: BitPosition 0 implies byte 0 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
# Raumtemperatur Kühlkreis @ 0x01DA: BitPosition 4 implies byte 0 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
# Meldungs Bitfeld @ 0x0700: NoConversion length 32 > 4 bytes -> custom decode
# Meldungs Bitfeld EEV1 @ 0x0704: NoConversion length 32 > 4 bytes -> custom decode
# Meldungs Bitfeld EEV2 @ 0x0705: NoConversion length 32 > 4 bytes -> custom decode
# Meldungs Bitfeld VV @ 0x0708: NoConversion length 32 > 4 bytes -> custom decode
# Meldung anstehend @ 0x1410: 4-bit field at BitPosition 61 does not fit in one byte -> custom decode
# WPR_vmarSchaltzeitenGroup_1_0 @ 0x9000: NoConversion length 24 > 4 bytes -> custom decode
