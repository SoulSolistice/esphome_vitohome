# ============================================================
# vitohome package generated for device: GWG_VBT2_00
# profile: standard   entities: 175
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON (GWG): 0 datapoint(s) whose access
# method is not one this engine can select via `access:` (KBUS_VIRTUAL_READ
# and friends) were omitted. Re-run with --no-reachable-only to include them.
#
# The generic system fault archive (0x7507..0x7558) is NOT emitted: those
# are fixed 16-bit Vitotronic addresses and GWG addresses a single byte,
# so no slot of it is reachable on this protocol.
#
# GWG catalog. Every entity carries `access:` -- the Vitosoft FCRead that
# selects the read TYPE byte. GWG's address space is PER ACCESS MODE, so
# address alone is NOT a datapoint identity here: dropping or changing an
# `access:` line silently points the entity at a different register.
# Writable datapoints are emitted as number/select/switch and write in the
# SAME `access:` mode they read in (Vitosoft pairs GWG reads and writes
# that way, e.g. EEPROM_READ with EEPROM_WRITE). Nothing on a GWG unit is
# writable in `physical` mode; the writable ones are `eeprom` and `be`.
# The KMBUS modes have no write TYPE byte at all and stay read-only.
#
# WRITES ARE UNCONFIRMED ON HARDWARE. The write TYPE bytes come from the
# openv wiki table and are corroborated by vogod, but no GWG write has
# been verified end-to-end anywhere, and the placement of the 0x04
# terminator in a write frame has no source at all (see
# gwgWriteEotBeforePayload). Reads are unaffected by that choice.
#
# On the read side only `physical` has hardware confirmation; the other
# modes are sourced from Vitosoft, the openv wiki and vcontrold, which
# agree. Verify on the unit before relying on a value.
#
# 1 datapoint(s) with an address above 0xFF were dropped
# (GWG addresses a single byte).
#
# Metadata: 24 entities carry a `# vito:` line with Vitosoft's own
# grouping, for the catalog editor: circuit=hk1..hk6|dhw|solar|boiler|
# cascade|mbus (the menu they are in), level=td (shown at the service
# access level only), overview, quickcheck and trend (Vitosoft's overview
# screen, quick check and trend recorder). ESPHome ignores them.
#
# System error history omitted: this unit has NO Optolink-reachable
# datapoints (KBUS/GFA/RPC-only device), so the generic 0x7507 fault
# archive can never answer. Re-run with --no-reachable-only to force it.
#
# 4 entity name(s) repeat within their platform in Vitosoft (e.g. one
# 'Pegel' per RF participant); each such name carries its id in parentheses,
# since ESPHome requires a unique name per platform.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value. number entities whose borders were absent in the
# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

