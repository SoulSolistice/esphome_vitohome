    type: enum
    name: "Spannungswiederkehr"
    id: vlogVSAlarmSpannungswiederkehr
    entity_category: diagnostic
    address: 0xAC10
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Nein"
      0x01: "Ja"

  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Sign-Of-Life"
    id: vlogVSAlarmSignOfLife
    entity_category: diagnostic
    address: 0xAC11
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Nein"
      0x01: "Ja"

  # --- (ohne Gruppenzuordnung) ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Letzter Fehler"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.Vitocom300_10.*)
    codes: &letzter_fehler_codes
      0x00: "Anlage ohne Fehler"
      0x02: "Spannungsausfall"
      0x03: "Spannungswiederkehr"
      0x04: "Fehler Flashdisk"
      0x05: "INC-Datei für Kor.AD-Werte nicht vorhanden"
      0x10: "Wartungstaster aktiviert"
      0x11: "Wartungstaster deaktiviert"
