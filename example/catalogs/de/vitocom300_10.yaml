    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Diagnose / Wartung ---
  - platform: vitohome
    type: enum
    name: "Wartungstaster"
    id: vlogVSAlarmZyklusWartungstaster
    entity_category: diagnostic
    address: 0xAC02
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "AUS"
      0x01: "EIN"

  # --- Konfiguration / Telefon ISDN ---
  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Modem - Typ"
    id: VDIALModemType
    address: 0xF020
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Analog-Modem"
      0x01: "ISDN-Terminaladapter"
      0x02: "GSM-Modem"

  # --- Funktionskontrolle / Anlage ---
  # vito: level=td
  - platform: vitohome
    type: enum
    name: "24h Trending abgelaufen"
    id: vlogVSAlarm24hTrending
    entity_category: diagnostic
    address: 0xAC12
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Nein"
      0x01: "Ja"

  # vito: level=td
