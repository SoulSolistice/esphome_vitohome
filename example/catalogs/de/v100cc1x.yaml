# --- datapoints needing custom decode (not auto-emitted) ---
# maximale Abgastemperatur zuruecksetzen @ 0x08A1: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Betriebsstunden Brenner Stufe 1 zurücksetzen @ 0x08A7: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# (24) Wartung zuruecksetzen @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Gasverbrauch Heizen Tag @ 0x9000: NoConversion length 32 > 4 bytes -> custom decode
# Gasverbrauch Heizen Woche @ 0x9020: NoConversion length 212 > 4 bytes -> custom decode
# Gasverbrauch Heizen Monat @ 0x90F4: NoConversion length 52 > 4 bytes -> custom decode
# Gasverbrauch WW Tag @ 0x9134: NoConversion length 32 > 4 bytes -> custom decode
# Gasverbrauch WW Woche @ 0x9154: NoConversion length 212 > 4 bytes -> custom decode
# Gasverbrauch WW Monat @ 0x9228: NoConversion length 52 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
# SA171 MAC-Adresse @ 0xD000: NoConversion length 18 > 4 bytes -> custom decode
