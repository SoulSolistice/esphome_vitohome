      0x31: "Kurzschluss Flammentemperatursensor"
      0x32: "Kurzschluss Lambda Sonde"
      0x33: "Kurzschluss Einschubtemperatursensor"
      0x38: "Unterbrechung Kesseltemperatursensor"
      0x39: "Unterbrechung Flammentempratursensor"
      0x3A: "Unterbrechung Lambda Sonde"
      0x3B: "Unterbrechung Einschubtemperatursensor"
      0x40: "Kurzschluss Sensor 4"
      0x44: "Kurzschluss VTS Mischermodul M1"
      0x46: "Kurzschluss VTS Mischermodul M2"
      0x48: "Unterbrechung Sensor 4"
