  # --- VBC550S / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Letzter Fehler"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.VBC550S.*)
    codes: &letzter_fehler_codes
      0x00: "Anlage ohne Fehler"
      0x0F: "Wartung durchführen"
      0x10: "Kurzschluss Außentemperatursensor"
      0x18: "Unterbrechung Außentemperatursensor"
      0x20: "Kurzschluss Sensor 2"
      0x28: "Unterbrechung Sensor 2"
