button:
  # --- (ohne Gruppenzuordnung) ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Wink"
    id: RPCWink
    address: 0xA000
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Teilnehmerliste loeschen"
    id: vlogRPCClearMemberList
    address: 0xA009
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Grundeinstellung Bedienparameter M2"
    id: BedienparameterM2FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x01]  # Vitosoft PrefixWrite 01
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Grundeinstellung Bedienparameter A1M1"
    id: BedienparameterA1M1FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # Vitosoft PrefixWrite 00
    entity_category: config
    disabled_by_default: true

# --- datapoints needing custom decode (not auto-emitted) ---
# Anzahl Brennerstarts zurücksetzen @ 0x088A: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# maximale Abgastemperatur zuruecksetzen @ 0x08A1: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Alle Ausgänge werden in den spannungslosen, neutralen Zustand geschaltet. @ 0x08AE: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Seriennummer der Grundleiterplatte: 9-stellige verwaltungsinterne Nummer @ 0x08C7: NoConversion length 9 > 4 bytes -> custom decode
# Logspeicher SC100 @ 0x0BF0: NoConversion length 10 > 4 bytes -> custom decode
# (24) Wartung zuruecksetzen @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# ServiceSommerzeit @ 0x7920: NoConversion length 6 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
# Temperaturanfoderung ist Maximalwert @ 0xA346: BitPosition 24 implies byte 3 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
