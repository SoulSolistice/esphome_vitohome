  # --- V100KC4B / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.V100KC4B.*)
    codes: &letzter_fehler_codes
      0x00: "No faults in the system"
      0x0F: "Service required"
      0x10: "Short circuit outside temperature sensor"
      0x18: "Lead break outside temperature sensor"
      0x19: "Communication error external outside temperature sensor"
      0x1A: "Wireless interference OTS"
      0x1B: "Communication error DCF-77"
      0x1C: "Wireless interference DCF-77"
      0x20: "Short circuit flow sensor HC1 or system"
      0x28: "Lead break flow sensor HC1 or system"
      0x30: "Short circuit boiler water temperature sensor"
      0x38: "Lead break boiler water temperature sensor"
      0x40: "Short circuit, flow sensor HC2"
      0x41: "Short circuit return sensor HC2"
      0x44: "Short circuit, flow sensor HC3"
      0x45: "Short circuit return sensor HC3"
      0x48: "Lead break, flow sensor HC2"
      0x49: "Lead break return sensor HC2"
      0x4C: "Lead break, flow sensor HC3"
      0x4D: "Lead break, return temp HC3"
      0x50: "Short circuit cylinder temperature sensor 1"
      0x51: "Short circuit cylinder temperature sensor 2"
      0x52: "Short circuit, buffer temperature sensor"
      0x54: "Fault boiler 5"
      0x55: "Fault boiler 6"
      0x56: "Fault boiler 7"
      0x57: "Fault boiler 8"
      0x58: "Lead break cylinder temperature sensor 1"
      0x59: "Lead break cylinder temperature sensor 2"
      0x5A: "Lead break, buffer temperature sensor 2"
      0x5C: "Failure boiler 5"
      0x5D: "Failure boiler 6"
      0x5E: "Failure boiler 7"
