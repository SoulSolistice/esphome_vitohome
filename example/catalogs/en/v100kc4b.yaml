button:
  # --- V100KC4B / DefaultSettings ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter A1M1"
    id: BedienparameterA1M1FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # Vitosoft PrefixWrite 00
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delete subscriber list"
    id: vlogRPCClearMemberList
    address: 0xA009
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delete fault history"
    id: valmRPCClearErrorHistoryTable
    address: 0xA029
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # --- (ohne Gruppenzuordnung) ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delivered condition codes"
    id: Konfi_FunktionReset_GWG
    address: 0xA050
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

# --- datapoints needing custom decode (not auto-emitted) ---
# Reset hours run burner stage 1 @ 0x08A7: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Reset maintenance @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
