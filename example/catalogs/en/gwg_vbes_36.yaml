    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x10  # Vitosoft BitPosition 3, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 Set cylinder temp + 20 K"
      1: "1 Set boiler water temperature 78 °C"

  - platform: vitohome
    name: "(15) DHW priority control"
    id: GWG_K15Speichervorrang
    address: 0x0005
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x20  # Vitosoft BitPosition 2, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 Without DHW priority control"
      1: "1 With DHW priority control"

  # --- Codierungen / Sonstiges ---
  - platform: vitohome
    name: "(12) Type of heating circuit pump"
    id: GWG_K12HKPDrehzahlgeregelt
    address: 0x0005
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x04  # Vitosoft BitPosition 5, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 Multi stage heating circuit pump"
      1: "1 Variable speed heating circuit pump"

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "(21) Function output X2"
    id: GWG_K21FunktionX2
    address: 0x0006
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x02  # Vitosoft BitPosition 6, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 DHW circulation pump"
      1: "1 Output signal DHW heating"

  - platform: vitohome
    name: "(30) Input plug X4.1⁄X4.2 acts as"
    id: GWG_K30ExterneUmschaltung
    address: 0x0007
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x01  # Vitosoft BitPosition 7, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 External operating mode changeover"
      1: "1 External demand"

  # vito: quickcheck
  - platform: vitohome
    name: "(99) Function output X2"
    id: GWG_BEMK99FunktionX2
    address: 0x0009
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x80  # Vitosoft BitPosition 0, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "0 DHW circulation pump"
      1: "1 Output signal DHW heating"

  - platform: vitohome
    name: "Heating program"
    id: GWG_BetriebsprogrammBEM
    address: 0x0057
    access: be  # Vitosoft BE_READ / BE_WRITE
    length: 1
    bit_mask: 0xF0  # Vitosoft BitPosition 0, BitLength 4 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Summer mode"
      1: "Constant reduced room temp"
      2: "Constant standard room temperature"
      3: "Winter mode"
      4: "Winter mode (0x04)"
      5: "Standby mode"

  - platform: vitohome
    name: "Weekday"
    id: GWG_Uhrzeit_Wochentag
    address: 0x0074
    access: be  # Vitosoft BE_READ / BE_WRITE
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x01: "Monday"
      0x02: "Tuesday"
      0x03: "Wednesday"
      0x04: "Thursday"
      0x05: "Friday"
      0x06: "Saturday"
      0x07: "Sunday"

switch:
  # --- Diagnose1 / Heizkreise ---
  - platform: vitohome
    name: "(22) Direct heating circuit at 04:02 or 04:03"
    id: GWG_K22DirekterHeizkreis
    address: 0x0006
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x04  # Vitosoft BitPosition 5, BitLength 1 (MSB-first)
    on_value: 0  # 0 Available
    off_value: 1  # 1 Not available
    disabled_by_default: true
    update_interval: 3600s

  # --- Codierungen / Anlage ---
  - platform: vitohome
    name: "(35) External demand or external operating mode changeover"
    id: GWG_K35FreigabeExterneAufschaltungen
    address: 0x0007
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x20  # Vitosoft BitPosition 2, BitLength 1 (MSB-first)
    # on 1 = 1 Enabled; off 0 = 0 Blocked (field values)
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "(27) Return temperature sensor"
    id: GWG_K27Ruecklaufsensor
    address: 0x0006
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x80  # Vitosoft BitPosition 0, BitLength 1 (MSB-first)
    # on 1 = 1 Available; off 0 = 0 Not available (field values)
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "(20) Remote control unit WC or RTD"
    id: GWG_K20FernbedienungAnalog
    address: 0x0006
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x01  # Vitosoft BitPosition 7, BitLength 1 (MSB-first)
    # on 1 = 1 Available; off 0 = 0 Not available (field values)
    disabled_by_default: true
    update_interval: 3600s

  # --- Codierungen / Warmwasser ---
  - platform: vitohome
    name: "(24) Set at time switch level"
    id: GWG_K24FestaufSUEbene
    address: 0x0006
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x10  # Vitosoft BitPosition 3, BitLength 1 (MSB-first)
    # on 1 = 1 Yes; off 0 = 0 No (field values)
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Bedienung / AmGeraet ---
  - platform: vitohome
    type: enum
    name: "Heating program"
    id: GWG_Betriebsprogramm
    address: 0x0051
    access: physical  # Vitosoft Physical_READ
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Summer mode"
      0x01: "Constant reduced room temp"
      0x02: "Constant standard room temperature"
      0x03: "Winter mode"
      0x04: "Winter mode (0x04)"
      0x05: "Standby mode"

  # --- Information / Heizkreise ---
  - platform: vitohome
    type: enum
    name: "Status time switch HC B"
    id: GWG_HKB_Schaltuhr
    address: 0x003A
    access: physical  # Vitosoft Physical_READ
    length: 1
    bit_mask: 0x0C  # Vitosoft BitPosition 4, BitLength 2 (MSB-first)
    disabled_by_default: true
    update_interval: 60s
    options:
      0: "0 Night mode"
      1: "1 Day mode"
      2: "2 Day mode"
      3: "3 Day mode"

  - platform: vitohome
    type: enum
    name: "Status time switch HC A"
    id: GWG_HKA_Schaltuhr
    address: 0x003A
    access: physical  # Vitosoft Physical_READ
    length: 1
    bit_mask: 0x03  # Vitosoft BitPosition 6, BitLength 2 (MSB-first)
    disabled_by_default: true
    update_interval: 60s
    options:
      0: "0 Night mode"
      1: "1 Day mode"
      2: "2 Day mode"
      3: "3 Day mode"

  # --- Diagnose2 / Brenner ---
