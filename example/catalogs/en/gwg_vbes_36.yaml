    access: kmbus_eeprom  # Vitosoft KMBUS_EEPROM_READ
    length: 6
    byte_offset: 2
    converter: div2
    unit_of_measurement: "K"
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  - platform: vitohome
    name: "Start differential burner in DHW mode"
    id: GWG_FA_Takt_WWEinschaltdifferenz
    address: 0x0078
    access: kmbus_eeprom  # Vitosoft KMBUS_EEPROM_READ
    length: 6
    byte_offset: 4
    converter: div2
    unit_of_measurement: "K"
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  # --- Codierungen / Anlage ---
    # NOTE: conversion 'MultOffset': value = field * 5 + 35 -> filters; no encode path for the transform -> read-only
  - platform: vitohome
    name: "(05) Maximum flow temperature HC B (mixer circuit)"
    id: GWG_K05VorlaufmaximaltemperaturHKB
    address: 0x0001
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x0F  # Vitosoft BitPosition 4, BitLength 4 (MSB-first)
    converter: noconv
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 5
      - offset: 35
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

    # NOTE: conversion 'MultOffset': value = field * 5 + 35 -> filters; no encode path for the transform -> read-only
  - platform: vitohome
    name: "(06) Maximum boiler water temperature"
    id: GWG_K06Kesselmaximaltemperatur
    address: 0x0001
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0xF0  # Vitosoft BitPosition 0, BitLength 4 (MSB-first)
    converter: noconv
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 5
      - offset: 35
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

    # NOTE: conversion 'MultOffset': value = field * 2 + 6 -> filters; no encode path for the transform -> read-only
  - platform: vitohome
    name: "(07) Differential temperature"
    id: GWG_K07Differenztemperatur
    address: 0x0002
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    bit_mask: 0x0F  # Vitosoft BitPosition 4, BitLength 4 (MSB-first)
    converter: noconv
    unit_of_measurement: "K"
    filters:
      - multiply: 2
      - offset: 6
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

  # --- (ohne Gruppenzuordnung) ---
  # vito: quickcheck
    # NOTE: conversion 'NoConversion' with fractional stepping: borders -5..5 step 0.125 imply value = raw * 0.125 + -5 (raw 0..80); export factor/offset (5, 35) ignored. UNVERIFIED inference -- read-only until a hardware write confirms it (writable in the export; not a number until confirmed)
  - platform: vitohome
    name: "(55) Value for correction of the actual room temperature"
    id: GWG_BEMK55Raumkorrekturwert
    address: 0x0016
    access: eeprom  # Vitosoft EEPROM_READ / EEPROM_WRITE
    length: 1
    converter: noconv
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.125
      - offset: -5
    state_class: measurement
    disabled_by_default: true
    update_interval: 3600s

  # vito: quickcheck
    # NOTE: export factor/offset (0.5, -16) ignored (stale on NoConversion bit fields)
    # NOTE: fractional stepping: borders imply value = field * 0.1 (field 0..10). UNVERIFIED inference -- read-only until a hardware write confirms it
  - platform: vitohome
    name: "(88) Switching point SPR 30L bottom (x BWSOLL)"
