text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Diagnose / Wartung ---
  - platform: vitohome
    type: enum
    name: "Maintenance button"
    id: vlogVSAlarmZyklusWartungstaster
    entity_category: diagnostic
    address: 0xAC02
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "OFF"
      0x01: "ON"

  # --- Konfiguration / Telefon ISDN ---
  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Modem - type"
    id: VDIALModemType
    address: 0xF020
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Analogue modem"
      0x01: "ISDN terminal adaptor"
      0x02: "GSM modem"

  # --- Funktionskontrolle / Anlage ---
  # vito: level=td
  - platform: vitohome
    type: enum
    name: "24h trending expired"
    id: vlogVSAlarm24hTrending
    entity_category: diagnostic
    address: 0xAC12
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "No"
      0x01: "Yes"

  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Power restored"
    id: vlogVSAlarmSpannungswiederkehr
    entity_category: diagnostic
    address: 0xAC10
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "No"
      0x01: "Yes"

  # vito: level=td
  - platform: vitohome
    type: enum
    name: "Sign of life"
    id: vlogVSAlarmSignOfLife
    entity_category: diagnostic
    address: 0xAC11
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "No"
      0x01: "Yes"

  # --- (ohne Gruppenzuordnung) ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.Vitocom300_10.*)
    codes: &letzter_fehler_codes
      0x00: "No faults in the system"
      0x02: "Power failure"
      0x03: "Power restored"
      0x04: "Fault, Flashdisk"
      0x05: "INC file for cor.AD values not available"
      0x10: "Service key enabled"
      0x11: "Service key disabled"
      0x12: "Service key timeout elapsed"
      0x20: "Life sign"
      0x30: "Fault communication AVR - H8"
      0x40: "Extension unit 1 communication interrupted"
      0x42: "Extension unit 2 communication interrupted"
      0x50: "Fault communication H8 - Neuron"
      0x51: "Test message VC300 at Vitodata"
      0xA0: "Trend file (*.BAK) was created"
      0xD0: "No life sign received from system"
      0xE0: "Subscriber failed"
      0xE1: "Subscriber failed"
      0xFF: "Input reports fault"

  # System fault history slot 2 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 1*9; vcontrold getError1).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Fault 02"
    id: fehler_02
