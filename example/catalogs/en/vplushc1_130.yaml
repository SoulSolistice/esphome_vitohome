sensor:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Boiler water temperature"
    id: TiefpassTemperaturwert_KTS
    address: 0x0810
    length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Int, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Hours run burner stage 1"
    id: BetriebsstundenBrenner1
    address: 0x0886
    length: 4
    converter: sec2hour
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    disabled_by_default: true
    update_interval: 600s

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "Flue gas temperature"
    id: TiefpassTemperaturwert_AGTS
    address: 0x0816
    length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Int, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

binary_sensor:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "BURNER"
    id: GWG_Flamme
    address: 0x55D3
    length: 9
    byte_offset: 5
    bit_mask: 0x20
    disabled_by_default: true
    update_interval: 60s

number:
  # --- Information ---
  # vito: circuit=boiler overview
  - platform: vitohome
    name: "Burner starts"
    id: BrennerstartsGWG
    address: 0x088A
    length: 4
    converter: noconv
    min_value: 0
    max_value: 1193045
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

select:
  # --- (ohne Gruppenzuordnung) ---
  # vito: quickcheck
  - platform: vitohome
    name: "(79) Central system fault manager"
    id: K79_KonfiFehlerManagerV100_V050
    address: 0x7779
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 No manager"
      0x01: "1 Fault manager"

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    type: enum
    name: "Diverter valve"
    id: Umschaltventil
    address: 0x0A10
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Undefined"
      0x01: "Direction heating"
      0x02: "Central position"
      0x03: "Direction DHW"

  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
