text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Diagnosis / Erweiterung EA2 ---
  - platform: vitohome
    type: enum
    name: "Digital input"
    id: SR13_DI1
    address: 0x0888
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "OFF"
      0x01: "ON"

  # --- EA2 / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.EA2.*)
    codes: &letzter_fehler_codes
      0x00: "No error"
      0x30: "Lead break, sensor 1"
      0x31: "Lead break sensor 2"
      0x38: "Short circuit, sensor 1"
      0x39: "Short circuit sensor 2"
      0xAE: "Error DIP switch EA2"
      0xB2: "Internal error EA2"
      0xB3: "Communication error EA2"
      0xD1: "Digital input EA2"

  # System fault history slot 2 of 10 (ecnsysEventType~Error,
