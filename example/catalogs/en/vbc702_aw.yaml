select:
  # --- Codierung 1 / Anlagendefinition ---
  # vito: quickcheck
  - platform: vitohome
    name: "(7000) System scheme"
    id: WPR_Anlagenkonfig_Anlagenschema
    address: 0x7000
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: DHW"
      0x01: "1: 1 HC"
      0x02: "2: 1 HC DHW"
      0x03: "3: 0 HC 1 MHC"
      0x04: "4: 0 HC 1 MHC DHW"
      0x05: "5: 1 HC 1 MHC"
      0x06: "6: 1 HC 1 MHC DHW"
      0x07: "7: 0 HC 1 MHC 1 MHC"
      0x08: "8: 0 HC 1 MHC 1 MHC DHW"
      0x09: "9: 1 HC 1 MHC 1 MHC"
      0x0A: "10: 1 HC 1 MHC 1 MHC DHW"
      0x0B: "11: External control"

  # vito: quickcheck
  - platform: vitohome
    name: "(700A) Cascade"
    id: WPR_Anlagenkonfig_Kaskade
    address: 0x700A
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: None"
      0x01: "1: Cascade via H1"
      0x02: "2: LON cascade"

  # vito: quickcheck
  - platform: vitohome
    name: "(7011) Operating mode changeover to HC"
    id: WPR_Anlagenkonfig_BA_UmschaltungAufHK
    address: 0x7011
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: DHW"
      0x01: "1: 1 HC"
      0x02: "2: 1 HC DHW"
      0x03: "3: 0 HC 1 MHC"
      0x04: "4: 0 HC 1 MHC DHW"
      0x05: "5: 1 HC 1 MHC"
      0x06: "6: 1 HC 1 MHC DHW"
      0x07: "7: 0 HC 1 MHC 1 MHC"
      0x08: "8: 0 HC 1 MHC 1 MHC DHW"
      0x09: "9: 1 HC 1 MHC 1 MHC"
      0x0A: "10: 1 HC 1 MHC 1MHC DHW"
      0x0B: "11: No changeover"

  # vito: quickcheck
  - platform: vitohome
    name: "(7012) Operating mode changeover effect"
    id: WPR_Anlagenkonfig_BA_Umschaltung_Wirkung
    address: 0x7012
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "STANDBY"
      0x01: "Reduced"
      0x02: "Standard"
      0x03: "FIXED VALUE"

  # vito: quickcheck
  - platform: vitohome
    name: "(7014) External demand mixer OPEN"
    id: WPR_Anlagenkonfig_ExternAnf_MiAuf
    address: 0x7014
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: M2 control mode M3 control mode demand no effect"
      0x01: "1: M2 OPEN M3 control mode demand no effect"
      0x02: "2: M2 control mode M3 OPEN demand no effect"
      0x03: "3: M2 OPEN M3 OPEN demand no effect"
      0x04: "4: M2 control mode M3 control mode demand effect"
      0x05: "5: M2 OPEN M3 control mode demand effect"
      0x06: "6: M2 control mode M3 OPEN demand effect"
      0x07: "7: M2 OPEN M3 OPEN demand effect"

  # vito: quickcheck
  - platform: vitohome
    name: "(7015) External blocking mixer CLOSED"
    id: WPR_Anlagenkonfig_ExternSperren_MiZu
    address: 0x7015
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: M2 control mode M3 control mode blocking no effect"
      0x01: "1: M2 OPEN M3 control mode blocking no effect"
      0x02: "2: M2 control mode M3 OPEN blocking no effect"
      0x03: "3: M2 OPEN M3 OPEN blocking no effect"
      0x04: "4: M2 control mode M3 control mode blocking effect"
      0x05: "5: M2 OPEN M3 control mode blocking effect"
      0x06: "6: M2 control mode M3 OPEN blocking effect"
      0x07: "7: M2 OPEN M3 OPEN blocking effect"
      0x08: "8: External blocking of AC M2 control mode M3 control mode blocking effect"

  # vito: quickcheck
  - platform: vitohome
    name: "(701A) External blocking effect HCP1"
    id: WPR_Anlagenkonfig_ExternSperrenWirkung_HKP1
    address: 0x701A
    length: 1
    bit_mask: 0x01  # Vitosoft BitPosition 7, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Control mode"
      1: "OFF"

  # vito: quickcheck
