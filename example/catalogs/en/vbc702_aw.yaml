  # --- Codierung 2 / Verdichter2 ---
  # vito: quickcheck
    # NOTE: conversion 'NoConversion' with fractional stepping: borders 0.5..30 step 0.5 imply value = raw * 0.5 (raw 1..60). UNVERIFIED inference -- read-only until a hardware write confirms it (writable in the export; not a number until confirmed)
