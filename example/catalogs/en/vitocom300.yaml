# --- datapoints needing custom decode (not auto-emitted) ---
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Telephone number 1 (F..= fax, S..=SMS) @ 0xAC20: FixedStringTerminalZeroes length 20 > 4 bytes -> custom decode
# Telephone number 2 (F..= fax, S..=SMS) @ 0xAC34: FixedStringTerminalZeroes length 20 > 4 bytes -> custom decode
