    update_interval: 60s
    options:
      0x00: "OFF"
      0x01: "ON"

  # --- DEKATEL M / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.DEKATEL_M.*)
    codes: &letzter_fehler_codes
      0x01: "Monitoring for 8 hours"
      0x02: "Dekatel/Vitocom: unacknowledged fault"
      0x03: "Dekatel/Vitocom: test message/function test"
      0xD0: "Digitaler Eingang (DE1): 0 V"
      0xD1: "Digitaler Eingang (DE1): 230 V"
      0xD2: "Digitaler Eingang (DE2): 0 V"
      0xD3: "Digitaler Eingang (DE2): 230 V"

  # System fault history slot 2 of 10 (ecnsysEventType~Error,
