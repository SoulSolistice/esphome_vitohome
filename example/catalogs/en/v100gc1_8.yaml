# ============================================================
# vitohome package generated for device: V100GC1_8
# profile: standard   entities: 279
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON: 2 datapoint(s) whose access method this
# engine has no read for (GFA_READ/PROZESS/KBUS/OT, and remote procedures
# that are neither a reading nor an action) were omitted as unreachable.
# Re-run with --no-reachable-only to include them.
#
# Actions: 3 procedures (P300 function code 0x07) as `type: action`
# buttons, all disabled by default. Pressing one RUNS it on the controller
# -- some clear a history, some reset settings or codings to their
# defaults. Read each one's name before you enable it.
#
# Remote procedure readings omitted: 16 (the LON participant
# list and LON identity, read by P300 function code 0x07). Without a LON
# module they hold only the unit's own defaults. --profile full includes them.
#
# LON inputs omitted: 13 network-variable input(s) (nvi*). A LON
# master writes them; without a LON module they hold no data (0xFF
# 'invalid'). --profile full includes them.
#
# 4 entity name(s) repeat within their platform in Vitosoft (e.g. one
# 'Pegel' per RF participant); each such name carries its id in parentheses,
# since ESPHome requires a unique name per platform.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value. number entities whose borders were absent in the
# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

