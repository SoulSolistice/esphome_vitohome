  # System fault history slot 3 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 2*9; vcontrold getError2).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Fault 03"
    id: fehler_03
    address: 0x7519
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.V150KB1_4.*)
    codes: *letzter_fehler_codes  # same map as above

  # System fault history slot 4 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 3*9; vcontrold getError3).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Fault 04"
    id: fehler_04
    address: 0x7522
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.V150KB1_4.*)
    codes: *letzter_fehler_codes  # same map as above

  # System fault history slot 5 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 4*9; vcontrold getError4).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
