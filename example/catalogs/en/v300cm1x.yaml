text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Information / Heizkreis A1 ---
  - platform: vitohome
    type: enum
    name: "Current operating mode A1M1"
    id: HK_AktuelleBetriebsartA1M1
    address: 0x2500
    length: 22
    byte_offset: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Standby mode"
      0x01: "Reduced mode"
      0x02: "Standard mode"
      0x03: "Standard mode (0x03)"

  - platform: vitohome
    type: enum
    name: "Heating circuit pump A1M1"
    id: HK_PumpenzustandA1M1
    address: 0x2906
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "OFF"
      0x01: "ON"

