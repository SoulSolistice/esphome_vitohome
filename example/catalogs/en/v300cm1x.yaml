button:
  # --- V300CM1x / DefaultSettings ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter A1M1"
    id: BedienparameterA1M1FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # Vitosoft PrefixWrite 00
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter M2"
    id: BedienparameterM2FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x01]  # Vitosoft PrefixWrite 01
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter M3"
    id: BedienparameterM3FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x02]  # Vitosoft PrefixWrite 02
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delete subscriber list"
    id: vlogRPCClearMemberList
    address: 0xA009
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # --- (ohne Gruppenzuordnung) ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delivered condition codes"
    id: Konfi_FunktionReset_GWG
    address: 0xA050
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

# --- datapoints needing custom decode (not auto-emitted) ---
# Actual boiler sequence @ 0x56E0: RotateBytes (big-endian) at 4 bytes is not decodable by the component (rotatebytes supports 2) -> custom decode
# Reset maintenance @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Gas consumption, heating, day @ 0x9000: NoConversion length 32 > 4 bytes -> custom decode
# Gas consumption, heating, week @ 0x9020: NoConversion length 212 > 4 bytes -> custom decode
# Gas consumption, heating, month @ 0x90F4: NoConversion length 52 > 4 bytes -> custom decode
# Gas consumption, DHW, day @ 0x9134: NoConversion length 32 > 4 bytes -> custom decode
# Gas consumption, DHW, week @ 0x9154: NoConversion length 212 > 4 bytes -> custom decode
# Gas consumption, DHW, month @ 0x9228: NoConversion length 52 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
# SA171 MAC address @ 0xD000: NoConversion length 18 > 4 bytes -> custom decode
# Password @ 0xD112: HexByte2DecimalByte length 8 > 4 bytes -> custom decode
# SA171 Time stamp @ 0xD123: NoConversion length 8 > 4 bytes -> custom decode
