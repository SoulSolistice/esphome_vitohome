# --- datapoints needing custom decode (not auto-emitted) ---
# Reset maintenance @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
# GWG KM Zusatzdaten SM1 @ 0xC100: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten EA1 @ 0xC110: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten AM1 @ 0xC120: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten DAP1 @ 0xC130: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten DAP2 @ 0xC140: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten Mischer HK2 @ 0xC150: NoConversion length 16 > 4 bytes -> custom decode
# GWG KM Zusatzdaten Mischer HK3 @ 0xC160: NoConversion length 16 > 4 bytes -> custom decode
