    address: 0x7701
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x01: "Single boiler"
      0x02: "Multi boiler LON"
      0x03: "Contact control"

  # --- Diagnose 2 / Relaistest ---
  - platform: vitohome
    name: "Actuator test"
    id: RelaistestGWG2010_Konstant
    address: 0x7500
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Disabled"
      0x01: "ALL PASSIVE"
      0x02: "BURNER MIN OUTPUT"
      0x03: "BURNER MAX OUTPUT"
      0x04: "INTERNAL PUMP"
      0x05: "VALVE HEATING"
      0x06: "VALVE CENTRE"
      0x07: "VALVE DHW"
      0x0B: "CE INTERNAL RELAY K12"
      0x0C: "CE EXTERNAL HCP"
      0x0D: "CE EXTERN CPP"
      0x0E: "CE EXTERN DHWCP"
      0x0F: "CE EXTERNAL CENTRAL FAULT MESSAGE"
      0xC4: "Output 1 solar module"
