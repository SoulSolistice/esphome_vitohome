text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- CU401B S ---
  - platform: vitohome
    type: enum
    name: "BURNER"
    id: VCaldens_Brennerstatus
    entity_category: diagnostic
    address: 0xB39D
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "OFF"
      0x01: "ON"

  - platform: vitohome
    type: enum
    name: "Mixer ext. heat source status"
    id: WPR_Mischer_ext_Waermerzeuger_Status
    entity_category: diagnostic
    address: 0x0603
    length: 8
    byte_offset: 4
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "AVAILABLE"
      0x01: "NOT AVAILABLE"

  # --- Diagnose / Allgemein ---
  - platform: vitohome
    type: ascii
    name: "Serial number control unit"
    id: HWHerstellNrRegelung
    address: 0xF000
    length: 16
    entity_category: diagnostic

  - platform: vitohome
    type: ascii
    name: "Serial number boiler"
    id: HWHerstellNrKessel
    address: 0xF010
    length: 16
    entity_category: diagnostic

  - platform: vitohome
    type: ascii
