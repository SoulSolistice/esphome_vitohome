    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x15]  # Vitosoft PrefixWrite 15
    entity_category: config
    disabled_by_default: true

# --- datapoints needing custom decode (not auto-emitted) ---
# Room temperature cooling circuit @ 0x01DA: BitPosition 4 implies byte 0 but the export declares BytePosition 2 -- contradictory, needs hardware confirmation before it can be emitted
# Message bit field @ 0x0700: NoConversion length 32 > 4 bytes -> custom decode
# Message bit field EEV1 @ 0x0704: NoConversion length 32 > 4 bytes -> custom decode
# Message bit field EEV2 @ 0x0705: NoConversion length 32 > 4 bytes -> custom decode
# Message bit field VV @ 0x0708: NoConversion length 32 > 4 bytes -> custom decode
# Message pending @ 0x1410: 4-bit field at BitPosition 61 does not fit in one byte -> custom decode
# WPR_vmar switching times group_1_0 @ 0x9000: NoConversion length 24 > 4 bytes -> custom decode
# Switching times HC1 @ 0x9000: NoConversion length 168 > 4 bytes -> custom decode
# Switching times HC2 @ 0x9007: NoConversion length 168 > 4 bytes -> custom decode
# Switching times HC3 @ 0x900E: NoConversion length 168 > 4 bytes -> custom decode
# Buffer cylinder switching times @ 0x9015: NoConversion length 168 > 4 bytes -> custom decode
# DHW switching times @ 0x901C: NoConversion length 168 > 4 bytes -> custom decode
# Switching times HC1 @ 0x9200: NoConversion length 168 > 4 bytes -> custom decode
# Switching times HC2 @ 0x9238: NoConversion length 168 > 4 bytes -> custom decode
# Switching times HC3 @ 0x9270: NoConversion length 168 > 4 bytes -> custom decode
# Buffer cylinder switching times @ 0x92A8: NoConversion length 168 > 4 bytes -> custom decode
# DHW switching times @ 0x92E0: NoConversion length 168 > 4 bytes -> custom decode
# DHWCP switching times @ 0x9318: NoConversion length 168 > 4 bytes -> custom decode
# Time program, el. heating @ 0x9350: NoConversion length 168 > 4 bytes -> custom decode
# Time program, ventilation @ 0x93C0: NoConversion length 168 > 4 bytes -> custom decode
# Coolant buffer time program @ 0x93F8: NoConversion length 168 > 4 bytes -> custom decode
