    id: K7B_Konfi_FunktionUhrSenden
    address: 0x777B
    length: 1
    # on 0x01 = Send; off 0x00 = Do not send
    disabled_by_default: true
    update_interval: 3600s

  # --- Functionscontroll / Zugriff Codierkarte ---
  - platform: vitohome
    name: "(1D) Shunt pump ON if burner ON"
    id: K1D_KonfiPumpenbeiBrennerein
    address: 0x571D
    length: 1
    # on 0x01 = Active; off 0x00 = Disabled
    disabled_by_default: true
    update_interval: 3600s

  # --- Overview / Solar ---
  - platform: vitohome
    name: "Solar reheating suppression"
    id: SolarNachlade
    address: 0x6551
    length: 1
    # on 0x01 = Active; off 0x00 = Disabled
    disabled_by_default: true
    update_interval: 3600s

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "Burner modulation CLOSED"
    id: DigitalAusgang_ModulationZu
    address: 0x0848
    length: 1
    # on 0x01 = ON; off 0x00 = OFF
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "External mixer OPEN M1"
    id: ExtMischerauf_M1
    address: 0x254A
    length: 1
    # on 0x01 = ON; off 0x00 = OFF
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "External mixer CLOSED M1"
    id: ExtMischerzu_M1
    address: 0x254B
    length: 1
    # on 0x01 = ON; off 0x00 = OFF
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "(8A) Display conditions for config. parameters"
    id: K8A_KonfiAnzeigebedingungenAktiv
    address: 0x778A
    length: 1
    on_value: 0xAF  # Active
    off_value: 0xB0  # Disabled
    disabled_by_default: true
    update_interval: 3600s

    # NOTE: writes are a read-modify-write of the whole 4-byte block
  - platform: vitohome
    name: "(System⁄boiler) set system (boiler) temperature is DHW demand"
    id: resProdCmd_CFDM_state2
    address: 0xA39B
    length: 4
    byte_offset: 2
    bit_mask: 0x10  # Vitosoft BitPosition 19, BitLength 1 (MSB-first)
    # on 1 = Active; off 0 = Disabled (field values)
    disabled_by_default: true
    update_interval: 3600s

    # NOTE: writes are a read-modify-write of the whole 4-byte block
  - platform: vitohome
    name: "Set system (boiler) temperature is maximum value"
    id: resProdCmd_CFDM_state1
    address: 0xA39B
    length: 4
    byte_offset: 2
    bit_mask: 0x80  # Vitosoft BitPosition 16, BitLength 1 (MSB-first)
    # on 1 = Active; off 0 = Disabled (field values)
    disabled_by_default: true
    update_interval: 3600s

