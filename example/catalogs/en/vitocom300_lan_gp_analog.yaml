# ============================================================
# vitohome package generated for device: Vitocom300_LAN_GP_Analog
# profile: standard   entities: 18
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON: 44 datapoint(s) requiring a non-Optolink
# access method (GFA_READ/RPC/PROZESS/KBUS/OT) were omitted as unreachable
# via VitoWiFi's read. Re-run with --no-reachable-only to include them.
#
# Remote procedure readings omitted: 16 (the LON participant
# list and LON identity, read by P300 function code 0x07). They answer only
# with a LON module. --profile full includes them.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value. number entities whose borders were absent in the
# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

sensor:
  # --- GPRS ---
  - platform: vitohome
    name: "Field strength"
    id: vc_gp_GPRS_Feldstaerke
    address: 0xAE03
    length: 1
    converter: noconv
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

number:
  # --- Konfiguration / Allgemein ---
  - platform: vitohome
    name: "Subscriber number"
    id: vcLanTeilnehmernummer
    address: 0x7777
    length: 1
    converter: noconv
    # Borders absent, or out of range for this byte width, in
    # the export. These placeholders pass `esphome config` but
    # pin the value to 0 - set real min/max/step before use.
    min_value: 0
    max_value: 0
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "System number"
    id: vcLanAnlagennummer
    address: 0x7776
    length: 1
    converter: noconv
    # Borders absent, or out of range for this byte width, in
    # the export. These placeholders pass `esphome config` but
    # pin the value to 0 - set real min/max/step before use.
    min_value: 0
    max_value: 0
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- GPRS ---
  - platform: vitohome
    type: enum
    name: "Modem type Vitocom"
    id: vcLanModemTyp
    address: 0xAE00
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "LAN"
      0x01: "ISDN"
      0x02: "Analogue"
      0x03: "GSM"
      0x04: "GPRS"

  - platform: vitohome
    type: enum
    name: "Status, SIM card"
    id: vc_gp_Zustand_SIM_Karte
    address: 0xAE01
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Unknown"
      0x01: "busy"
      0x02: "no SIM card inserted"
      0x03: "logged in"
      0x04: "requires PIN"
      0x05: "requires PUK"
      0x06: "SIM card error"

  - platform: vitohome
    type: enum
    name: "GPRS connection"
    id: vc_gp_GPRS_Verbindung
    address: 0xAE02
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "No GPRS connection"
      0x01: "GPRS connection available"

  - platform: vitohome
    type: enum
    name: "Power restored"
    id: vc_gp_Spannungswiederkehr
    address: 0xAE04
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "Vitocom has not been restarted"
      0x01: "Vitocom has been restarted"

  # --- (ohne Gruppenzuordnung) ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.Vitocom300_LAN_GP_Analog.*)
    codes: &letzter_fehler_codes
      0x00: "No faults in the system"
      0x02: "Power failure"
      0x03: "Power restored"
      0x04: "Fault, Flashdisk"
      0x10: "Service key enabled"
      0x11: "Service key disabled"
      0x12: "Service key timeout elapsed"
      0x20: "Life sign"
      0xD0: "No life sign received from system"
      0xE0: "Fault manager failed"
      0xE1: "Subscriber failed"
      0xFA: "Error, analogue input"
      0xFB: "Limit undershot"
      0xFC: "Limit overshot"
      0xFD: "Error, digital input"
      0xFE: "Communication with extension module interrupted"

