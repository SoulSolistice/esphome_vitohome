# nvoNodeAlarm_location @ 0x0826: NoConversion length 6 > 4 bytes -> custom decode
# ecnsysEventType~BHKWErrorIndex @ 0x7561: NoConversion length 90 > 4 bytes -> custom decode
# Serial number control unit @ 0xF000: NoConversion length 16 > 4 bytes -> custom decode
# Serial number device/appliance @ 0xF010: NoConversion length 16 > 4 bytes -> custom decode
# Service data 9 @ 0xF030: NoConversion length 208 > 4 bytes -> custom decode
