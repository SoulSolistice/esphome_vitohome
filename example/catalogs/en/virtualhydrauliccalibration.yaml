sensor:
  # --- Installation / HK / Parameter HK A1M1 ---
  # vito: circuit=hk1
  - platform: vitohome
    name: "Set room temperature A1M1"
    id: HK_RaumsolltemperaturaktuellA1M1
    address: 0x2500
    length: 22
    byte_offset: 12
    byte_length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Byte, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  # --- Installation / HK / Parameter HK A2M2 ---
  # vito: circuit=hk2
  - platform: vitohome
    name: "Set room temperature M2"
    id: HK_RaumsolltemperaturaktuellM2
    address: 0x3500
    length: 22
    byte_offset: 12
    byte_length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Byte, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  # --- Installation / HK / Parameter HK A3M3 ---
  # vito: circuit=hk3
  - platform: vitohome
    name: "Set room temperature M3"
    id: HK_RaumsolltemperaturaktuellM3
    address: 0x4500
    length: 22
    byte_offset: 12
    byte_length: 2
    converter: div10
    signed: false  # Vitosoft ParameterType Byte, lower border 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

select:
  # --- Installation / Parameter Allgemein ---
  # vito: quickcheck
  - platform: vitohome
    name: "(00) Heating circuit DHW scheme"
    id: K00_KonfiAnlagenschemaV300_V333
    address: 0x7700
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x01: "1 A1"
      0x02: "2 A1 + DHW"
      0x03: "3 M2"
      0x04: "4 M2 + DHW"
      0x05: "5 A1 + M2"
      0x06: "6 A1 + M2 + DHW"
      0x07: "7 M2 + M3"
      0x08: "8 M2 + M3 + DHW"
      0x09: "9 A1 + M2 + M3"
      0x0A: "10 A1 + M2 + M3 + DHW"
      0x00: "Without heating circuit/cylinder (multi boiler system)"

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic
