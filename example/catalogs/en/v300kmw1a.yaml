text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Identifikation ---
  - platform: vitohome
    type: enum
    name: "Type DHW"
    id: BauartWarmwasser
    address: 0x8851
    length: 1
