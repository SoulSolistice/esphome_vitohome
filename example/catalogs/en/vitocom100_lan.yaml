# ============================================================
# vitohome package generated for device: Vitocom100_LAN
# product (Vitosoft): Vitocom 100 LAN1 [VC 100 LAN1]
# profile: standard   entities: 4
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON: 3 datapoint(s) whose access method this
# engine has no read for (GFA_READ/PROZESS/KBUS/OT, and remote procedures
# that are neither a reading nor an action) were omitted as unreachable.
# Re-run with --no-reachable-only to include them.
#
# Metadata: 3 entities carry a `# vito:` line with Vitosoft's own
# grouping, for the catalog editor: circuit=hk1..hk6|dhw|solar|boiler|
# cascade|mbus (the menu they are in), level=td (shown at the service
# access level only), overview, quickcheck and trend (Vitosoft's overview
# screen, quick check and trend recorder). ESPHome ignores them.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value. number entities whose borders were absent in the
# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

number:
  # --- Versionen ---
  # vito: overview
  - platform: vitohome
    name: "System number"
    id: vcLanAnlagennummer
    address: 0x7776
    length: 1
    converter: noconv
    # Borders absent, or out of range for this byte width, in
    # the export. These placeholders pass `esphome config` but
    # pin the value to 0 - set real min/max/step before use.
    min_value: 0
    max_value: 0
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

  # vito: overview
  - platform: vitohome
    name: "Subscriber number"
    id: vcLanTeilnehmernummer
    address: 0x7777
    length: 1
    converter: noconv
    # Borders absent, or out of range for this byte width, in
    # the export. These placeholders pass `esphome config` but
    # pin the value to 0 - set real min/max/step before use.
    min_value: 0
    max_value: 0
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- Versionen ---
  # vito: overview
  - platform: vitohome
    type: enum
    name: "Modem type Vitocom"
    id: vcLanModemTyp
    address: 0xAE00
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "LAN"
      0x01: "ISDN"
      0x02: "Analogue"
      0x03: "GSM"
      0x04: "GPRS"
