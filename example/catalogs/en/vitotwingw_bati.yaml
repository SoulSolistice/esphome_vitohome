  # --- VitotwinGW BATI ---
  # System fault history slot 1 of 10 (ecnsysEventType~VitotwinErrorHistory,
  # 120-byte block at 0x7000 + 0*12; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault (Vitotwin)"
    id: letzter_fehler_vitotwin
    address: 0x7000
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.VitotwinGW_BATI.*)
    codes: &letzter_fehler_vitotwin_codes
      0x0A: "10: External sensor"
      0x14: "20: Boiler sensor 1"
      0x1E: "30: Flow sensor 1"
      0x20: "32: Flow sensor 2"
      0x28: "40: Return sensor 1"
      0x32: "50: DHW sensor 1"
      0x3C: "60: Room sensor 1"
      0x41: "65: Room sensor 2"
      0x44: "68: Room sensor 3"
      0x46: "70: Buffer sensor 1"
      0x47: "71: Buffer sensor 2"
      0x48: "72: Buffer sensor 3"
      0x53: "83: BSB short circuit"
      0x54: "84: BSB address conflict"
      0x55: "85: BSB wireless communication"
      0x5B: "91: Data loss in EEPROM"
      0x5C: "92: Device electronics error"
      0x5F: "95: Time invalid"
      0x60: "96: Minor SW error"
      0x61: "97: SW or HW error"
      0x62: "98: Extension module 1"
      0x63: "99: Extension module 2"
      0x66: "102: Clock without power reserve"
      0x69: "105: Maintenance message"
      0x79: "121: Flow temperature HC1"
      0x7A: "122: Flow temperature HC2"
      0x7F: "127: Legionella temp"
      0x9D: "157: Boiler flow thermost."
      0x9E: "158: Condensate"
      0xA4: "164: Flow pressure switch, heating circuit"
      0xBB: "187: Configuration output"
      0xD9: "217: Sensor error"
      0xFD: "253: Cause of fault unclear"
      0xFE: "254: Unknown fault code"

  # System fault history slot 2 of 10 (ecnsysEventType~VitotwinErrorHistory,
  # 120-byte block at 0x7000 + 1*12; vcontrold getError1).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Fault 02 (Vitotwin)"
    id: fehler_02_vitotwin
    address: 0x700C
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.VitotwinGW_BATI.*)
    codes: *letzter_fehler_vitotwin_codes  # same map as above

  # System fault history slot 3 of 10 (ecnsysEventType~VitotwinErrorHistory,
  # 120-byte block at 0x7000 + 2*12; vcontrold getError2).
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Fault 03 (Vitotwin)"
