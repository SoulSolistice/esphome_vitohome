text_sensor:
  - platform: vitohome
    type: device_id
    name: "Device type"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- DiagnosisDiagnosis1 / Erweiterung ---
  - platform: vitohome
    type: enum
    name: "DIP switch functional extension set to"
    id: DIPSchalterKAE0_10V_PumpenKR
    address: 0x757F
    length: 1
    bit_mask: 0x0E  # Vitosoft BitPosition 4, BitLength 3 (MSB-first)
    disabled_by_default: true
    update_interval: 60s
    options:
      0: "0 invalid"
      1: "1 invalid"
      2: "2 invalid"
      3: "Night contact HCP A1/M1"
