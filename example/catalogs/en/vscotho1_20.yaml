    options:
      0x00: "HVAC_AUTO"
      0x01: "HVAC_HEAT"
      0x02: "HVAC_MRNG_WRMUP"
      0x03: "HVAC_COOL"
      0x04: "HVAC_NIGHT_PURGE"
