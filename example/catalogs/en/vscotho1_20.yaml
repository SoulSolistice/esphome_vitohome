  # --- VScotHO1 20 / Lasterror ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.VScotHO1_20.*)
    codes: &letzter_fehler_codes
      0x00: "No faults in the system"
      0x0F: "Service required"
      0x10: "Short circuit outside temperature sensor"
      0x18: "Lead break outside temperature sensor"
      0x20: "Short circuit flow sensor system"
      0x28: "Lead break flow sensor system"
      0x30: "Short circuit boiler water temperature sensor"
      0x38: "Lead break boiler water temperature sensor"
      0x40: "Short circuit, flow sensor HC2"
      0x48: "Lead break, flow sensor HC2"
      0x50: "Short circuit cylinder temperature sensor / comfort sensor / primary sensor"
      0x51: "Short circuit outlet temperature sensor"
      0x58: "Lead break cylinder temperature sensor/comfort sensor/primary sensor"
      0x59: "Lead break outlet temperature sensor"
      0x92: "Solar control unit: Short circuit, sensor S1"
      0x93: "Solar control unit: Short circuit, sensor S3"
      0x94: "Solar control unit: short circuit sensor S2"
      0x9A: "Solar: Lead break, collector temp. sensor"
      0x9B: "Vitosolic: Lead break, collector return"
      0x9C: "Solar: Lead break, cylinder temp. sensor"
      0x9F: "Solar control unit: general fault"
      0xA6: "Fault impressed current anode not OK"
      0xA7: "Fault clock module programming unit"
      0xA8: "Internal pump reports air"
      0xA9: "Internal pump blocked"
      0xB0: "Short circuit flue gas temperature sensor"
      0xB1: "Fault programming unit"
      0xB4: "Internal fault temperature capture"
      0xB5: "Internal fault, EEPROM"
      0xB7: "Boiler coding card incorrect/faulty"
      0xB8: "Lead break flue gas temperature sensor"
      0xB9: "Faulty transfer of coding card data"
      0xBA: "Communication fault mixer HC2"
      0xBC: "Fault remote control HC1"
      0xBD: "Fault remote control HC2"
      0xBF: "LON module incorrect/faulty"
      0xC2: "Communication fault solar control unit"
      0xC5: "Fault variable speed pump - internal pump"
      0xC6: "Fault variable speed pump heating circuit 2"
      0xC7: "Fault variable speed pump heating circuit 1"
      0xCD: "Communication error, Vitocom 100"
      0xCE: "Communication fault connection extension external"
      0xCF: "Communication fault LON module"
      0xDA: "Short circuit room temperature sensor HC1"
      0xDB: "Short circuit room temperature sensor HC2"
      0xDD: "Lead break room temperature sensor HC1"
      0xDE: "Lead break room temperature sensor HC2"
      0xE0: "Fault, external LON subscriber"
      0xE4: "Fault in voltage supply 24V - burner control unit"
      0xE5: "Fault flame amplifier - burner control unit"
      0xE6: "Min. air/water pressure not reached"
      0xF0: "Communication fault to burner control unit"
      0xF1: "Flue gas temperature limiter responded"
      0xF2: "Temperature limiter responded - excessive temperature"
      0xF3: "Flame pretence"
      0xF4: "no flame"
      0xF5: "Fault air pressure switch"
      0xF6: "Fault gas pressure switch"
