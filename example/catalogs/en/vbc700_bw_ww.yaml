  # --- VBC700 BW WW / Lasterror ---
  # Fault history record 1 of 30 (ecnsysEventType~WPRError, a 30 x 8-byte
  # remote procedure array at 0xA801: one call per record, the
  # record index 0 as the parameter). Raw hex: the record layout is not
  # decoded yet. Index 0 is taken as the newest; unconfirmed on hardware.
  - platform: vitohome
    type: raw
    name: "Last fault (WPR)"
    id: letzter_fehler_wpr
    address: 0xA801
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # the record index
    length: 8
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s

  # Fault history record 2 of 30 (ecnsysEventType~WPRError, a 30 x 8-byte
  # remote procedure array at 0xA801: one call per record, the
  # record index 1 as the parameter). Raw hex: the record layout is not
  # decoded yet.
  - platform: vitohome
    type: raw
    name: "Fault 02 (WPR)"
    id: fehler_02_wpr
    address: 0xA801
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x01]  # the record index
    length: 8
