select:
  # --- Codierung 1 / Kommunikation LON ---
  - platform: vitohome
    name: "LON objects outside temperature distribution"
    id: WPR_LONObjekte_AussenTemp
    address: 0x7797
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Local"
      0x01: "1: Receive from field BUS (e.g. LON)"
      0x02: "2: Send to field BUS (e.g. LON)"

  - platform: vitohome
    name: "(77FF) LON objects field BUS time distribution"
    id: WPR_LONObjekte_Feldbus_Uhrzeit
    address: 0x77FF
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Local"
      0x01: "1: Receive from field BUS (e.g. LON)"
      0x02: "2: Send to field BUS (e.g. LON)"

  # --- ProgrammingCooling / Kuehlung ---
  - platform: vitohome
    name: "(7100) Natural cooling circuit"
    id: WPR_SepNCKreis_NatCooling_Kreis
    address: 0x7100
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "No"
      0x01: "Yes"
      0x02: "NC with mixer"
      0x03: "Active cooling"

  - platform: vitohome
    name: "(7106) Natural cooling room temp sens ranking"
    id: WPR_SepNCKreis_NatCooling_RaumTempSens_Rangierung
    address: 0x7106
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Use of the NC room sensor"
      0x01: "1: Use of the HC1 room sensor"
      0x02: "2: Use of the HC2 room sensor"
      0x03: "3: Use of the HC3 room sensor"

  - platform: vitohome
    name: "(7100) Cooling"
    id: WPR_SepNCKreis_NatCooling_Kuehlkreis
    address: 0x7101
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x01: "Cooling on HC1"
      0x02: "Cooling on HC2"
      0x03: "Cooling on HC3"
      0x04: "Cooling on separate cooling circuit"

  # --- ProgrammingHC / HK1allgemein ---
  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "(2004) HC1 operating mode heating circuit"
    id: WPR_HK1_Betriebsart_Heizkreis
    address: 0x2004
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Standby: Frost protection"
      0x01: "1: Constant reduced room temp"
      0x02: "2: Constant standard room temp"
      0x03: "3: Fixed value controller to max. flow temp"
      0x04: "4: Switching times"
      0x05: "5: Operating mode selector"
      0x06: "6: Standard"

  - platform: vitohome
    name: "(200B) HC1 room temperature hook-up"
