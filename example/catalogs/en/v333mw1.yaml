  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "Operating mode M2 (BedienBetriebsartM2)"
    id: BedienBetriebsartM2
    address: 0x3301
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Only DHW"
      0x01: "Continuous reduced"
      0x02: "Continuous standard"
      0x03: "Heating + DHW"
      0x04: "Heating + DHW (0x04)"
      0x05: "Standby"

  - platform: vitohome
    name: "Remote control heating circuit M2"
    id: KA0_FernbedienungM2
    address: 0x37A0
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "NOT AVAILABLE"
      0x01: "Vitotrol 200"
      0x02: "Vitotrol 300"

  - platform: vitohome
    name: "(E5) ID pump heating circuit M2"
    id: KE5_KonfiKennung_D_PumpeM2
    address: 0x37E5
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 Multi stage"
      0x01: "1 Variable speed"

  - platform: vitohome
    name: "(E8) Speed auxiliary mode regulated pump M2"
    id: KE8_KonfiDPumpeDrehzahlNebenbetriebM2
    address: 0x37E8
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Minimum"
      0x01: "Reduced"

  - platform: vitohome
    name: "Switching times DHW M3"
    id: AutomaticFlag_WWM3
    address: 0x4300
    length: 1
    bit_mask: 0x01  # Vitosoft BitPosition 7, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Individual"
      1: "Autom. acc. to heating periods"

  - platform: vitohome
    name: "Switching times DHW circulation pump M3"
    id: AutomaticFlag_ZPM3
    address: 0x4300
    length: 1
    bit_mask: 0x02  # Vitosoft BitPosition 6, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Individual"
      1: "Autom. acc. to heating periods"

  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "Operating mode M3 (BedienBetriebsartM3)"
    id: BedienBetriebsartM3
    address: 0x4301
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Only DHW"
      0x01: "Continuous reduced"
      0x02: "Continuous standard"
      0x03: "Heating + DHW"
      0x04: "Heating + DHW (0x04)"
      0x05: "Standby"

  - platform: vitohome
    name: "(E5) ID pump heating circuit M3"
    id: KE5_KonfiKennung_D_PumpeM3
    address: 0x47E5
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 Multi stage"
      0x01: "1 Variable speed"

  - platform: vitohome
    name: "(E8) Speed auxiliary mode regulated pump M3"
    id: KE8_KonfiDPumpeDrehzahlNebenbetriebM3
    address: 0x47E8
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Minimum"
      0x01: "Reduced"

