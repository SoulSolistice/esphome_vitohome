      0x49: "Lead break return sensor HC2"
      0x4C: "Lead break, flow sensor HC3"
      0x4D: "Lead break return sensor HC3"
      0x50: "Short circuit cylinder temperature sensor 1"
      0x51: "Short circuit cylinder temperature sensor 2"
      0x58: "Lead break cylinder temperature sensor 1"
      0x59: "Lead break cylinder temperature sensor 2"
      0x60: "Short circuit temperature sensor 17"
      0x68: "Lead break temperature sensor 17"
      0x70: "Short circuit temperature sensor 17B"
      0x78: "Lead break temperature sensor 17B"
      0x92: "Solar control unit: Short circuit, sensor S1"
      0x93: "Solar control unit: Short circuit, sensor S3"
      0x94: "Solar control unit: short circuit sensor S2"
      0x9A: "Solar control unit: Lead break, sensor S1"
