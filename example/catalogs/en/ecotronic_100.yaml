button:
  # --- (ohne Gruppenzuordnung) ---
  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Wink"
    id: RPCWink
    address: 0xA000
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Delete subscriber list"
    id: vlogRPCClearMemberList
    address: 0xA009
    access: rpc  # Vitosoft Remote_Procedure_Call
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter M2"
    id: BedienparameterM2FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x01]  # Vitosoft PrefixWrite 01
    entity_category: config
    disabled_by_default: true

  # WARNING: pressing this RUNS a procedure on the controller (Vitosoft
  # Remote_Procedure_Call), at once and without asking. Nothing here undoes
  # it. It is disabled by default: enable it only once you know what it does.
  - platform: vitohome
    type: action
    name: "Factory setting operating parameter A1M1"
    id: BedienparameterA1M1FunktionReset
    address: 0xA051
    access: rpc  # Vitosoft Remote_Procedure_Call
    prefix: [0x00]  # Vitosoft PrefixWrite 00
    entity_category: config
    disabled_by_default: true

# --- datapoints needing custom decode (not auto-emitted) ---
# Reset number of burner starts @ 0x088A: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Reset maximum flue gas temperature @ 0x08A1: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# All outputs are switched to zero volt, neutral state. @ 0x08AE: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Serial number of main PCB: 9-digit internal administration number @ 0x08C7: NoConversion length 9 > 4 bytes -> custom decode
# Reset maintenance @ 0x5724: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# ecnsysEventType~ErrorIndex @ 0x7561: NoConversion length 10 > 4 bytes -> custom decode
# Service summertime @ 0x7920: NoConversion length 6 > 4 bytes -> custom decode
# Domain @ 0xA000: NoConversion length 6 > 4 bytes -> custom decode
# Neuron ID @ 0xA009: NoConversion length 6 > 4 bytes -> custom decode
# Default setting, DHW circulation @ 0xA051: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Default setting, general @ 0xA051: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Default setting, DHW @ 0xA051: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
# Default setting, solar @ 0xA051: WRITE-ONLY register (Vitosoft AccessMode 'Write'); a trigger with no read-back -> not auto-emitted.
