select:
  # --- BedienungA1 / Betriebsdaten ---
  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "Operating mode A1M1"
    id: BedienteilBA_GWGA1_Konstant
    address: 0x2323
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Standby"
      0x01: "Only DHW"
      0x02: "Heating + DHW"

  # --- Diagnose 1 / Warmwasser ---
  - platform: vitohome
    name: "(00) Cylinder control algorithm"
    id: K00_NRP_KonfiWW_Algorithmus
    address: 0x6700
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 Standard"
      0x01: "1 Adaptive"
      0x02: "2 2-sensor"
      0x03: "3 HE set"

  # --- Diagnose 1 / Erweiterung AM1 ---
  - platform: vitohome
    name: "(30) Connection extension AM1 ID"
    id: K30_NRP_Kennung_AM1
    address: 0x7730
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: Without connection extension 1"
      0x01: "1: With connection extension 1"

  - platform: vitohome
    name: "(31) AM1: Function output 1"
    id: K31_NRP_KonfiAM1FunktionAusgang1
    address: 0x7731
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: DHWCP (DHW circulation pump)"
      0x01: "1: HCP (Heating circuit pump, direct heating circuit)"
      0x02: "2: CPP (cylinder primary pump)"
      0x03: "3: Neutralising system / flue gas heat exchanger"
      0x04: "4: Distribution pump (master and cascade only)"

  - platform: vitohome
    name: "(32) AM1: Function output 2"
    id: K32_NRP_KonfiAM1FunktionAusgang2
    address: 0x7732
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: DHWCP (DHW circulation pump)"
      0x01: "1: HCP (Heating circuit pump, direct heating circuit)"
      0x02: "2: CPP (cylinder primary pump)"
      0x03: "3: Neutralising system / flue gas heat exchanger"
      0x04: "4: Distribution pump (master and cascade only)"

  # --- Diagnose 2 / Kommunikation ---
  - platform: vitohome
    name: "System type"
    id: K01_KonfiAnlagentyp_D
    address: 0x7701
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x01: "Single boiler"
      0x02: "Multi boiler LON"
      0x03: "Contact control"

  - platform: vitohome
    name: "(1B) PM1 pump module"
    id: K1B_KonfiKennungPumpenmodul
    address: 0x771B
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0: No pump module"
      0x01: "1: With pump module"

  # --- Diagnose 2 / Relaistest ---
