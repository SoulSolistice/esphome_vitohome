      0x00: "Minimum"
      0x01: "Reduced"

  # --- HC1 ---
  # vito: circuit=hk1 trend
  # Writable operating-mode (Betriebsart). KNOWN ISSUES on real 0x20CB /
  # VScotHO1 units (see project notes / hardware audit):
  #  * openv/community drives the mode at 0x2301 with 6 options
  #    (Warmwasser/Reduziert/Normal/Heizen+WW/Heizen+WW FS/Abschaltbetrieb);
  #    Vitosoft lists this variant's write here with fewer options.
  #  * Writes may be ACKed yet not take effect: a Bedienteil program-switch
  #    interlock, a read/write address split, or a firmware-accepted value
  #    subset narrower than the enum. Verify with `debug:` under uart:.
  #  * The 'aktuelle Betriebsart' READ (a bit-field in the 0x2500 block)
  #    does NOT decode correctly and is intentionally not emitted.
  - platform: vitohome
    name: "Operating mode A1M1"
    id: BedienBetriebsartA1M1
    address: 0x2301
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Only DHW"
      0x01: "Continuous reduced"
      0x02: "Continuous standard"
      0x03: "Heating + DHW"
      0x04: "Heating + DHW (0x04)"
      0x05: "Standby"

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "Switching times DHW circulation pump A1M1"
    id: AutomaticFlag_ZPA1M1
    address: 0x2300
    length: 1
    bit_mask: 0x02  # Vitosoft BitPosition 6, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Individual"
      1: "Autom. acc. to heating periods"

  - platform: vitohome
    name: "Switching times DHW A1M1"
    id: AutomaticFlag_WWA1M1
    address: 0x2300
    length: 1
    bit_mask: 0x01  # Vitosoft BitPosition 7, BitLength 1 (MSB-first)
    disabled_by_default: true
    update_interval: 3600s
    options:
      0: "Individual"
      1: "Autom. acc. to heating periods"

  - platform: vitohome
    name: "Boiler in fault mode"
    id: KesselinFehlerbetrieb
    address: 0x551B
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "No error"
      0x01: "Fault BWTS - CTS ok"
      0x02: "Fault BWTS - no CTS"
      0x03: "BWTS ok - no CTS"

  - platform: vitohome
    name: "(7C) Reset"
    id: K7C_KonfiResetAktiv1
    address: 0x777C
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "Standard status"
      0x2A: "Reset control unit"

