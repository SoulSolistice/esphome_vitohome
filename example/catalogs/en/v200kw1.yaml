  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Last fault"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # Fault-code texts: Vitosoft, for this device (viessmann.errorcode.V200KW1.*)
    codes: &letzter_fehler_codes
      0x00: "No faults in the system"
      0x0F: "Service required"
      0x10: "Short circuit outside temperature sensor"
      0x18: "Lead break outside temperature sensor"
      0x30: "Short circuit boiler water temperature sensor"
      0x38: "Lead break boiler water temperature sensor"
      0x50: "Short circuit cylinder temperature sensor 1"
      0x51: "Short circuit cylinder temperature sensor 2"
      0x58: "Lead break cylinder temperature sensor 1"
      0x59: "Lead break cylinder temperature sensor 2"
      0xAE: "Internal fault mixer extension"
      0xAF: "Internal fault mixer extension"
      0xB0: "Short circuit flue gas temperature sensor"
      0xB1: "Fault programming unit"
      0xB4: "Internal fault temperature capture"
      0xB5: "Internal fault, EEPROM"
      0xB6: "Hardware detection invalid"
      0xB7: "Boiler coding card incorrect/faulty"
      0xB8: "Lead break flue gas temperature sensor"
      0xB9: "Faulty transfer of coding card data"
      0xBC: "Fault remote control HC1"
      0xBD: "Fault remote control HC2"
      0xBE: "Fault remote control HC3"
      0xC1: "External safety device"
      0xC4: "Communication fault function extension 0-10V"
      0xC5: "Fault variable speed pump heating circuit 1"
      0xC6: "Fault variable speed pump heating circuit 2"
      0xC7: "Fault variable speed pump heating circuit 3"
      0xCD: "Communication error, Vitocom 100"
      0xD1: "Burner fault boiler"
      0xD4: "Fault high limit safety cut-out boiler"
      0xDA: "Short circuit room temperature sensor HC1"
      0xDB: "Short circuit room temperature sensor HC2"
      0xDD: "Lead break room temperature sensor HC1"
