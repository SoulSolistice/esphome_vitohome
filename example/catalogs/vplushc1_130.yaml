# vitohome package generated for device: VPlusHC1_130
# profile: standard   entities: 22
#
# Generated by scripts/gen_catalog.py from a Vitosoft XML export.
# Define the `vitohome:` hub and `uart:` in your device YAML and
# include this file via `packages:`. All entities are
# disabled_by_default; enable the ones you want in Home Assistant.
#
# FCRead filter ON: 1 datapoint(s) requiring a non-Optolink
# access method (GFA_READ/RPC/PROZESS/KBUS/OT) were omitted as unreachable
# via VitoWiFi's read. Re-run with --no-reachable-only to include them.
#
# VERIFY ON HARDWARE: not every address answers on every firmware.
# Run `esphome config` then `esphome compile`/`run` before relying
# on any value. number entities whose borders were absent in the
# export get min/max/step = 0/0/1 placeholders: valid config, but
# pinned to 0 until you fill in the real bounds.
# ============================================================

sensor:
  # --- Information ---
  - platform: vitohome
    name: "TiefpassTemperaturwert KTS"
    id: TiefpassTemperaturwert_KTS
    address: 0x0810
    length: 2
    converter: div10
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  - platform: vitohome
    name: "BetriebsstundenBrenner1"
    id: BetriebsstundenBrenner1
    address: 0x0886
    length: 4
    converter: sec2hour
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    disabled_by_default: true
    update_interval: 600s

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "TiefpassTemperaturwert AGTS"
    id: TiefpassTemperaturwert_AGTS
    address: 0x0816
    length: 2
    converter: div10
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

binary_sensor:
  # --- Information ---
  - platform: vitohome
    name: "GWG Flamme"
    id: GWG_Flamme
    address: 0x55D3
    length: 9
    byte_offset: 5
    bit_mask: 0x20
    disabled_by_default: true
    update_interval: 60s

number:
  # --- Information ---
  - platform: vitohome
    name: "BrennerstartsGWG"
    id: BrennerstartsGWG
    address: 0x088A
    length: 4
    converter: noconv
    min_value: 0
    max_value: 1193045
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "nviBoilerCmd BLR value"
    id: nviBoilerCmd_BLR_value
    address: 0xA300
    length: 1
    converter: div2
    unit_of_measurement: "%"
    # Borders absent, or out of range for this byte width, in
    # the export. These placeholders pass `esphome config` but
    # pin the value to 0 - set real min/max/step before use.
    min_value: 0
    max_value: 0
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

  - platform: vitohome
    name: "nviSetpoint BLR"
    id: nviSetpoint_BLR
    address: 0xA303
    length: 2
    converter: div100
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 0
    max_value: 127
    step: 0.1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

select:
  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    name: "K79 KonfiFehlerManagerV100 V050"
    id: K79_KonfiFehlerManagerV100_V050
    address: 0x7779
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "0 kein Manager"
      0x01: "1 Fehlermanager"

  - platform: vitohome
    name: "nviApplicMode BLR"
    id: nviApplicMode_BLR
    address: 0xA302
    length: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "HVAC_AUTO"
      0x01: "HVAC_HEAT"
      0x02: "HVAC_MRNG_WRMUP"
      0x03: "HVAC_COOL"
      0x04: "HVAC_NIGHT_PURGE"
      0x05: "HVAC_PRE_COOL"
      0x06: "HVAC_OFF"
      0x07: "HVAC_TEST"
      0x08: "HVAC_EMERG_HEAT"
      0x09: "HVAC_FAN_ONLY"
      0x0A: "HVAC_FREE_COOL"
      0x0B: "HVAC_ICE"
      0x6E: "HVAC_SLAVE_ACTIVE"
      0x6F: "HVAC_LOW_FIRE"
      0x70: "HVAC_HIGH_FIRE"
      0x64: "HVAC_FLOW_TEMP"
      0xFF: "HVAC_NUL"

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- (ohne Gruppenzuordnung) ---
  - platform: vitohome
    type: enum
    name: "Umschaltventil"
    id: Umschaltventil
    address: 0x0A10
    length: 1
    disabled_by_default: true
    update_interval: 60s
    options:
      0x00: "undefiniert"
      0x01: "Richtung Heizen"
      0x02: "Mittelstellung"
      0x03: "Richtung Warmwasser"

    # NOTE: field at BytePosition 1 has no declared write address -> demoted to read-only
  - platform: vitohome
    type: enum
    name: "nviBoilerCmd BLR state"
    id: nviBoilerCmd_BLR_state
    address: 0xA300
    length: 2
    byte_offset: 1
    disabled_by_default: true
    update_interval: 3600s
    options:
      0x00: "AUS"
      0x01: "EIN"
      0xFF: "AUTO"

  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
