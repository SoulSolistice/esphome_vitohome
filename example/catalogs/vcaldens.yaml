# ============================================================

sensor:
  # --- Information ---
  - platform: vitohome
    name: "TiefpassTemperaturwert KTS"
    id: TiefpassTemperaturwert_KTS
    address: 0x0810
    length: 2
    converter: div10
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    disabled_by_default: true
    update_interval: 60s

  - platform: vitohome
    name: "BetriebsstundenBrenner1"
    id: BetriebsstundenBrenner1
    address: 0x0886
    length: 4
    converter: sec2hour
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    disabled_by_default: true
    update_interval: 600s

binary_sensor:
  # --- Information ---
  - platform: vitohome
    name: "GWG Flamme"
    id: GWG_Flamme
    address: 0x55D3
    length: 9
    byte_offset: 5
    bit_mask: 0x20
    disabled_by_default: true
    update_interval: 60s

number:
  # --- Information ---
  - platform: vitohome
    name: "BrennerstartsGWG"
    id: BrennerstartsGWG
    address: 0x088A
    length: 4
    converter: noconv
    min_value: 0
    max_value: 1193045
    step: 1
    mode: box
    disabled_by_default: true
    update_interval: 3600s

text_sensor:
  - platform: vitohome
    type: device_id
    name: "Geraete-Typ"
    id: device_type
    icon: "mdi:identifier"
    entity_category: diagnostic

  # --- (ohne Gruppenzuordnung) ---
  # System fault history slot 1 of 10 (ecnsysEventType~Error,
  # 90-byte block at 0x7507 + 0*9; vcontrold getError0).
  # Slot 1 = newest entry -- hardware-confirmed on VScotHO1_72.
  # If the device NAKs the 9-byte block read, drop length to 1 (code only).
  - platform: vitohome
    type: error_history
    name: "Letzter Fehler"
    id: letzter_fehler
    address: 0x7507
    length: 9
    icon: "mdi:alert-circle"
    entity_category: diagnostic
    update_interval: 300s
    # codes: { 0x00: "kein Fehler", ... }  # add a code->text map

