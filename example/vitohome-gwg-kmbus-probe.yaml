# =============================================================================
# vitohome -- GWG KM-BUS PROBE  (issue #35)
# =============================================================================
# How a GWG unit frames a KM-bus read is unknown: the generic `01 43 ADDR LEN
# 04` was never answered on #35, and no source shows a working one
# (docs/gwg_protocol.md, "kmbus_eeprom"). This config sends candidate frames
# as open frames (raw_op.h, `gwg f`): the bytes go out exactly as written, and
# whatever the unit answers is collected until the line is quiet.
#
# Standalone for validation. Add your own network (the reference board uses
# SPI-Ethernet / DM9051) + api/ota as in user_curated/vscotho1_72/, and your
# UART pins. Flash it instead of your usual config: it carries no catalog, so
# nothing else runs on the bus while it probes.
#
#   A  candidates  seven framings, each for address 01 (one byte, Vitosoft's
#                  GWG_FA_OEM_Kennung) and for F8 (the 4-byte ID each KM-bus
#                  participant has):
#                    01 43 01 01 04                        generic, KM-bus EEPROM
#                    01 33 01 01 04                        generic, KM-bus RAM
#                    01 43 03 00 00 00 01 01 01 01 04      Vitosoft's prefix,
#                                                          address, length
#                    01 43 03 00 00 00 01 01 01 04         the prefix, address
#                    01 43 [03 00 00 00 01 01 01] 04       the same with a CRC
#                    01 43 [03 00 43 0A 01 01 01 01] 04    a KM-bus telegram
#                    01 43 [03 00 33 0A 01 01 01 01] 04    the same, CMD 33
#                  The GWG TYPE bytes 43 and 33 are KM-bus commands too. The
#                  two forms without a length byte are #35's reporter's, as
#                  given. `[ ]` appends the CRC-16/KERMIT of the bytes inside;
#                  the last two hand the controller a whole bus telegram,
#                  which only works if it relays bytes unchanged.
#   B  send frame  the line in "KM-Bus Probe: Frame", for anything else,
#                  e.g. another participant code or `/ 4` for a fixed answer
#                  length. Same syntax as the scanner's "Raw op".
#
# Each answer lands on "KM-Bus Probe: Result" and in the log
# (`Raw: gwg frame, ... ms: 0x0000: ...`); silence shows as FAILED (timeout).
# Every frame is logged (log_frames).
#
# The answer deadline is 600 ms instead of 250 ms: a read the controller
# relays over the KM-bus (1200 baud) needs about 180-240 ms on the bus
# alone. It stays below the idle-ENQ gap, but an answer that ends shortly
# before an idle ENQ may show that ENQ as a trailing 05.
#
# These are untested bytes: if a framing is wrong, the controller may read
# them as something else. That is why the hub needs
# `raw_access: unrestricted` and `unsafe_raw_writes: true` for them.
# =============================================================================

substitutions:
  vitohome_repo: "https://github.com/SoulSolistice/esphome_vitohome"
  vitohome_ref: "main"

esphome:
  name: vitohome-gwg-kmbus-probe
  on_boot:
    priority: -100
    then:
      - lambda: id(vito).set_gwg_response_timeout_ms(600);

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: ${vitohome_repo}
      ref: ${vitohome_ref}
    components: [vitohome]
    refresh: 0s

logger:
  baud_rate: 0 # free the UART for Optolink
  level: DEBUG

uart:
  id: optolink_uart
  rx_pin: GPIO5
  tx_pin: GPIO2
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 2

vitohome:
  id: vito
  uart_id: optolink_uart
  protocol: GWG
  log_frames: true
  raw_queue_size: 2 # the script queues one frame at a time
  raw_access: unrestricted
  unsafe_raw_writes: true

text_sensor:
  - platform: vitohome
    vitohome_id: vito
    type: scan_result
    name: "KM-Bus Probe: Result"
    entity_category: diagnostic

text:
  - platform: template
    id: kmbus_probe_frame
    name: "KM-Bus Probe: Frame"
    optimistic: true
    mode: text
    max_length: 120
    initial_value: "gwg f 01 43 [03 00 43 0A 01 01 F8 04] 04"
    entity_category: config

globals:
  - id: kmbus_probe_i
    type: int
    initial_value: "0"

script:
  - id: kmbus_probe_candidates
    mode: single
    then:
      - lambda: |-
          id(kmbus_probe_i) = 0;
          ESP_LOGI("kmbus", "A: candidates");
      - while:
          condition:
            lambda: "return id(kmbus_probe_i) < 14;"
          then:
            - wait_until:
                condition:
                  lambda: "return id(vito).raw_queue_pending() == 0;"
                timeout: 30s
            - lambda: |-
                static const char *const frames[14] = {
                    "gwg f 01 43 01 01 04",
                    "gwg f 01 33 01 01 04",
                    "gwg f 01 43 03 00 00 00 01 01 01 01 04",
                    "gwg f 01 43 03 00 00 00 01 01 01 04",
                    "gwg f 01 43 [03 00 00 00 01 01 01] 04",
                    "gwg f 01 43 [03 00 43 0A 01 01 01 01] 04",
                    "gwg f 01 43 [03 00 33 0A 01 01 01 01] 04",
                    "gwg f 01 43 F8 04 04",
                    "gwg f 01 33 F8 04 04",
                    "gwg f 01 43 03 00 00 00 01 01 F8 04 04",
                    "gwg f 01 43 03 00 00 00 01 01 F8 04",
                    "gwg f 01 43 [03 00 00 00 01 01 F8] 04",
                    "gwg f 01 43 [03 00 43 0A 01 01 F8 04] 04",
                    "gwg f 01 43 [03 00 33 0A 01 01 F8 04] 04",
                };
                const char *frame = frames[id(kmbus_probe_i)];
                ESP_LOGI("kmbus", "A%d: %s", id(kmbus_probe_i) + 1, frame);
                id(vito).queue_raw_op(frame);
                id(kmbus_probe_i)++;
      - wait_until:
          condition:
            lambda: "return id(vito).raw_queue_pending() == 0;"
          timeout: 30s
      - delay: 5s
      - lambda: 'ESP_LOGI("kmbus", "A: done");'

button:
  - platform: template
    name: "KM-Bus Probe A: candidates"
    on_press:
      - script.execute: kmbus_probe_candidates
  - platform: template
    name: "KM-Bus Probe B: send frame"
    on_press:
      - lambda: |-
          ESP_LOGI("kmbus", "B: %s", id(kmbus_probe_frame).state.c_str());
          id(vito).queue_raw_op(id(kmbus_probe_frame).state);
